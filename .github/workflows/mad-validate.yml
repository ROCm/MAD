name: Validate model registries and agent skills

# GPU-free checks: every registered model (static and get_models_json.py),
# madengine discovery, the agent skills/subagents, and the Dockerfile templates.
on:
  pull_request:
    paths:
      - "models.json"
      - "scripts/**"
      - "docker/**"
      - ".claude/**"
      - ".agents/**"
      - "tools/validation/**"
      - "tools/infx2mad.py"
      - "tools/disagg_emitter.py"
      - "tools/validate_configs.py"
      - "tools/tests/infx2mad_ci_clusters.yaml"
      - "requirements.txt"
      - ".github/workflows/mad-validate.yml"
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/Primus feeds scripts/primus_train/get_models_json.py
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install madengine and validator dependencies
        run: pip install -r requirements.txt pyyaml jinja2

      - name: Validate every registered model
        run: python3 tools/validation/model_config_validator.py --require-dynamic

      - name: madengine discovers every model
        run: madengine discover --tags all > /dev/null

      - name: Lint skills, subagents and Codex links
        run: python3 tools/validation/skill_validator.py

      - name: Render every Dockerfile template
        run: |
          renderer=.claude/skills/mad-generate-dockerfile/scripts/render_dockerfile.py
          for framework in $(python3 "$renderer" --list | grep -v '^ ' | cut -d: -f1); do
            python3 "$renderer" --framework "$framework" > "/tmp/$framework.Dockerfile"
            python3 tools/validation/dockerfile_validator.py "/tmp/$framework.Dockerfile" > /dev/null
          done

  infx2mad:
    # The translator is deterministic at a pinned InferenceX commit, so its
    # whole output can be checked without a GPU or a cluster: every scenario
    # that maps to a runner is translated and every emitted block is validated
    # against the runner it targets.
    runs-on: ubuntu-latest
    env:
      INFERENCEX_COMMIT: 47cdc9d02d2f50018efbbc207c0c3ce9e425dae4
      # What the pinned commit translates to on tools/tests/infx2mad_ci_clusters.yaml.
      # A change here is a change in what the translator emits: update it on purpose.
      EXPECTED: "translated 26 scenario(s), 220 points"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch the pinned InferenceX commit
        run: |
          git init --quiet /tmp/InferenceX
          git -C /tmp/InferenceX fetch --quiet --depth 1 https://github.com/SemiAnalysisAI/InferenceX.git "$INFERENCEX_COMMIT"
          git -C /tmp/InferenceX checkout --quiet FETCH_HEAD

      - name: Translate every scenario that maps to a runner
        run: |
          python3 tools/infx2mad.py --infx /tmp/InferenceX/inferencex-e2e --all \
            --cluster ci-gfx950 --cluster-file tools/tests/infx2mad_ci_clusters.yaml \
            --out-dir /tmp/infx-out --mad-dir "$PWD" | tee /tmp/infx-sweep.log
          tail -n 1 /tmp/infx-sweep.log | grep -Fx "$EXPECTED"

      - name: Validate the emitted blocks against their runners
        run: python3 tools/validate_configs.py /tmp/infx-out

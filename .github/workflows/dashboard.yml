name: Status dashboard

# Builds the MAD Recipes site (tools/dashboard/build.py) and publishes it to GitHub Pages.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   DASHBOARD_PAGES=true            deploy from develop (also set Settings > Pages > Source: GitHub Actions)
#   DASHBOARD_SOURCE_REPO=ROCm/MAD  optional: describe another repo's develop instead of this checkout,
#                                   e.g. when the site is hosted from a fork
#
# The schedule keeps the site current with merges, issues and PRs that cannot trigger this
# workflow (upstream changes never trigger a fork's workflows). Scheduled runs use the default branch.
on:
  pull_request:
    paths:
      - "models.json"
      - "scripts/**"
      - "docker/**"
      - "dashboard/**"
      - "tools/dashboard/**"
      - "requirements.txt"
      - ".github/workflows/dashboard.yml"
  push:
    branches: [develop]
    paths:
      - "models.json"
      - "scripts/**"
      - "docker/**"
      - "dashboard/**"
      - "tools/dashboard/**"
      - "requirements.txt"
      - ".github/workflows/dashboard.yml"
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The Roadmap page queries open issues and PRs through GraphQL.
  issues: read
  pull-requests: read

# A newer push supersedes a PR build; on develop, runs queue so a deploy is never cut off.
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Scheduled rebuilds only make sense where the site is published.
    if: github.event_name != 'schedule' || vars.DASHBOARD_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/Primus feeds the Primus and JAX get_models_json.py registries.
          submodules: true

      - name: Check out the MAD tree to describe
        if: vars.DASHBOARD_SOURCE_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DASHBOARD_SOURCE_REPO }}
          ref: develop
          path: source
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install madengine and dashboard dependencies
        run: pip install -r requirements.txt pyyaml jinja2 pytest

      - name: Unit tests
        run: python3 -m pytest -q tools/dashboard

      # Warnings (unknown ROCm versions, a roadmap that could not be read, ...) go to the job
      # summary. A run that can deploy fails instead of publishing an empty Roadmap, so the
      # site already live stays up.
      - name: Build site
        env:
          # Read-only use: open issues and PRs for the Roadmap page.
          GH_TOKEN: ${{ github.token }}
          REPO_ROOT: ${{ vars.DASHBOARD_SOURCE_REPO != '' && 'source' || '.' }}
          SOURCE_REPO: ${{ vars.DASHBOARD_SOURCE_REPO || github.repository }}
          REQUIRE_ROADMAP: ${{ github.event_name != 'pull_request' && vars.DASHBOARD_PAGES == 'true' && '--require-roadmap' || '' }}
        run: >
          python3 tools/dashboard/build.py --out _site
          --repo-root "$REPO_ROOT" --source-repo "$SOURCE_REPO" $REQUIRE_ROADMAP

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: vars.DASHBOARD_PAGES == 'true' && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One Pages deployment at a time, never cancelled midway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

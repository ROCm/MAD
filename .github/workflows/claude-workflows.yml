name: Test Claude Code workflows

# Runs the .claude/workflows scripts against a scripted mock agent: argument
# parsing, plan/execute behavior, context threading and tune-search statistics.
# No GPU, no Claude. Also syntax-checks the shared shell helpers and checks
# that the Codex agents in .codex/agents match .claude/agents.
on:
  pull_request:
    paths:
      - ".claude/workflows/**"
      - ".claude/skills/mad-common/**"
      - ".claude/hooks/**"
      - ".claude/agents/**"
      - ".codex/**"
      - "tools/agent_config/**"
      - "tools/tests/**"
      - ".github/workflows/claude-workflows.yml"
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Workflow unit tests
        run: node --test tools/tests/*.test.mjs

      - name: Shell helpers parse
        run: for f in .claude/skills/mad-common/*.sh .claude/hooks/*.sh; do bash -n "$f"; done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Codex agents match .claude/agents
        run: |
          pip install pyyaml
          python3 tools/agent_config/codex_agents.py --check

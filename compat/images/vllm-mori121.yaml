# The vllm-mori121 stack: a card selects it with "image_spec": "${images.vllm-mori121}".
# The validated v1.2.1 (mori121) disaggregated stack: MoRI v1.2.1, AITER 0.1.16.post3 wheel, the
# Wide-EP WRITE-mode vLLM branch of 06/29, vllm-router, and (default) the rixl transport stack.
extends: ${images.di-vllm}
base:
  gfx942: rocm/vllm-dev:ci_base-0fcd9b99cc9d63202da4c858d8ebc6582c9e2491@sha256:c08a4e70734b41c8f5a876af07d8b3f705cecd262d21e5f6483ad48ca554d298
components:
  mori: e31d426a@di
  amd-aiter: 0.1.16.post3@aiter-release
  flydsl: 0.2.2@di
  vllm: dccb412e+5ebb40fa@di
  vllm-router: 1d10e71f+0cc1c443@di
  ucx: da3fac2a@di
  googletest: 1.14.0@di
  rixl: f33a5599@di
  rocshmem: 9c43b232@di
  deepep: 0f63d3e9@di-cx7
order:
- mori
- amd-aiter
- flydsl
- vllm
- vllm-router
- ucx
- googletest
- rixl
- rocshmem
- deepep
env:
  LD_LIBRARY_PATH: /usr/local/ucx/lib:/usr/local/lib:/usr/local/RIXL/install/lib:$LD_LIBRARY_PATH
  PATH: /usr/local/ucx/bin:$PATH
finish:
- test -x /usr/local/ucx/bin/ucx_info
- 'python3 -c ''import mori, mori.io, mori.ops, aiter, vllm; print("stack OK: vllm", vllm.__version__)'''
- vllm-router --help 2>&1 | grep -q moriio
- rm -rf /root/.mori /tmp/mori_jit_* && mkdir -p /root/.mori

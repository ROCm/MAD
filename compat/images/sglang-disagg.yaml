# The sglang-disagg stack: a card selects it with "image_spec": "${images.sglang-disagg}".
# SGLang disaggregated stack: the SGLang release image per architecture, sglang-router, and MoRI
# 158c7e8 on gfx942 (gfx950's image ships the MoRI it needs).
base:
  gfx942: lmsysorg/sglang:v0.5.12.post1-rocm720-mi30x@sha256:c57e916022622cd9ce00da1ab95314f531abc55de8146bf226dd8f4d938e5d5a
  gfx950: rocm/sgl-dev:v0.5.20-rocm720-mi35x-20260924@sha256:baadaba198e23c46c1dd651b5edefae8000bd5430943bd10b246b563905b3ecf
setup:
- sed -i 's|http://|https://|g' /etc/apt/sources.list
system_packages:
- git
- ibverbs-utils
- libibverbs-dev
- openmpi-bin
- libopenmpi-dev
- libpci-dev
- libdw1
- locales
- libgrpc-dev
- libgrpc++-dev
- libprotobuf-dev
- protobuf-compiler-grpc
- cmake
env:
  PYTHONPATH: '$PYTHONPATH:/sgl-workspace/mori:/sgl-workspace/aiter:'
components:
  sglang-router: 0.3.2@pypi
  py-spy: 0.4.2@pypi
  flask: 3.1.3@pypi
  pyyaml: 6.0.1@pypi
order:
- sglang-router
- py-spy
- flask
- pyyaml
variants:
  gfx942:
    components:
      mori: 158c7e83@sglang
    order:
    - sglang-router
    - py-spy
    - flask
    - pyyaml
    - mori
finish:
- 'python3 -c ''import sglang, mori; print("stack OK: sglang", sglang.__version__)'''

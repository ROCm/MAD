# The vllm-glm51 stack (was docker/pins/vllm-glm51.json): generated by docker/pins/to_image_spec.py.
# A card selects it with "image_spec": "${images.vllm-glm51}" (madengine image_spec).
about: 'GLM-5.1-FP8 disaggregated stack: MoRI 624002c, AITER with the ROCm/aiter#4957 gqa64 fix, vLLM for GLM-5.1, vllm-router; MoRI-EP only by default.'
base:
  gfx942: rocm/vllm-dev:ci_base-dedbf6be8b1afa17a6220473b9c8c98242ac1c03@sha256:c513ec5e374842bc85b6757dac120385303cad7cbf1882907eb26f2d33b66d56
copy:
- from: pins/check_vllm_stack.py
  to: /opt/mad/pins/check_vllm_stack.py
system_packages:
- git
- build-essential
- cmake
- ninja-build
- ccache
- libssl-dev
- pkg-config
env:
  PIP_CONSTRAINT: /etc/pip-constraints.txt
  MORI_GPU_ARCHS: '{gpu_arch}'
  BUILD_UMBP: 'OFF'
  BUILD_UMBP_SPDK: 'OFF'
  VLLM_TARGET_DEVICE: rocm
  PYTORCH_ROCM_ARCH: '{gpu_arch}'
  MAX_JOBS: '32'
  AITER_JIT_DIR: /opt/vllm_cache/aiter_jit
  VLLM_CACHE_ROOT: /opt/vllm_cache/vllm
  TRITON_CACHE_DIR: /opt/vllm_cache/triton
  COMGR_CACHE_DIR: /opt/vllm_cache/comgr
variants:
  gfx942:
    setup:
    - sed -i 's|http://|https://|g' /etc/apt/sources.list 2>/dev/null || true
    - sed -i 's|http://|https://|g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
    - mkdir -p /app /opt/mad/pins
    - printf '%s\n' PIN_SET=vllm-glm51 GPU_ARCH=gfx942 MAX_JOBS=32 'NVCC_THREADS='"'"''"'"'' NIC_ARCH=cx7 'PIP_CONSTRAINTS='"'"''"'"'' 'PIP_AFTER_ENGINE='"'"''"'"'' 'PIP_EARLY='"'"''"'"'' 'PIP_EARLY_UPGRADE='"'"''"'"'' MORI_BUILD=1 MORI_REPO=https://github.com/ROCm/mori.git MORI_COMMIT=624002c897a30928ec04c14fc167bf2b8a93f6ce AITER_KIND=source 'AITER_WHEEL_URL='"'"''"'"'' 'AITER_VERSION='"'"''"'"'' AITER_REPO=https://github.com/ROCm/aiter.git AITER_COMMIT=1d872fa07aadfcbb199851fe17e6822efaceca61 AITER_PATCHES=/opt/mad/patches/aiter/gqa64.patch AITER_ARCH_ENV=0 AITER_CHECK_CONV=0 FLYDSL_VERSION=0.3.1 'FLYDSL_PIP_FLAGS='"'"'--no-deps -U'"'"'' VLLM_REPO=https://github.com/vllm-project/vllm.git VLLM_COMMIT=d626108b1841888ec90aced33367149a6bbc7e4b VLLM_PATCHES=/opt/mad/patches/vllm/glm51.patch ROUTER_REPO=https://github.com/vllm-project/router.git ROUTER_COMMIT=1d10e71fb7bb4c0adc9f2c16ec77bf5dd4aa1586 ROUTER_PATCHES=/opt/mad/patches/router/dp-rank-kv-notify.patch RUST_TOOLCHAIN=1.88.0 TRANSPORTS_BUILD=0 UCX_REPO=https://github.com/ROCm/ucx.git UCX_COMMIT=da3fac2afcb55df7605f619ee19b37f4505bd4e4 RIXL_REPO=https://github.com/ROCm/RIXL.git RIXL_COMMIT=f33a5599400eb8da47ecdad20111ccb35b41a709 ROCSHMEM_REPO=https://github.com/ROCm/rocm-systems.git ROCSHMEM_COMMIT=9c43b23229cf2f835b838f72c0d1af3d4876167c DEEPEP_REPO=https://github.com/ROCm/DeepEP.git DEEPEP_COMMIT=0f63d3e97f0e43b47926179d7f3f304b3bc9554e GTEST_TARBALL=https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz > /opt/mad/pins/build.env
    - printf 'PIN_SET=%s\nGPU_ARCH=%s\nBASE_IMAGE=%s\n' vllm-glm51 gfx942 rocm/vllm-dev:ci_base-dedbf6be8b1afa17a6220473b9c8c98242ac1c03@sha256:c513ec5e374842bc85b6757dac120385303cad7cbf1882907eb26f2d33b66d56 > /app/versions.txt
    - printf '%s\n' '' > /etc/pip-constraints.txt
    - pip install meson==0.64.0 'pybind11[global]' tqdm prettytable
components:
  mori: 624002c8@di
  amd-aiter: 1d872fa0+a511bf4b+flydsl0.3.1@di
  vllm: d626108b+e055be85@vllm-glm51
  vllm-router: 1d10e71f+0cc1c443@di
order:
- mori
- amd-aiter
- vllm
- vllm-router
finish:
- python3 /opt/mad/pins/check_vllm_stack.py all
- rm -rf /root/.mori /tmp/mori_jit_* && mkdir -p /root/.mori
- echo JIT_SCRUBBED=1 >> /app/versions.txt
- cat /app/versions.txt

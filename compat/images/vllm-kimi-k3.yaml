# The vllm-kimi-k3 stack (was docker/pins/vllm-kimi-k3.json): generated by docker/pins/to_image_spec.py.
# A card selects it with "image_spec": "${images.vllm-kimi-k3}" (madengine image_spec).
about: 'Kimi-K3 stack for gfx942 and gfx950: MoRI fe12a11, AITER 68e42f5f from source, vLLM for Kimi-K3, vllm-router, and the rixl transport stack.'
base:
  gfx942: rocm/vllm-dev:ci_base-0fcd9b99cc9d63202da4c858d8ebc6582c9e2491@sha256:c08a4e70734b41c8f5a876af07d8b3f705cecd262d21e5f6483ad48ca554d298
  gfx950: rocm/vllm-dev:ci_base-0fcd9b99cc9d63202da4c858d8ebc6582c9e2491@sha256:c08a4e70734b41c8f5a876af07d8b3f705cecd262d21e5f6483ad48ca554d298
copy:
- from: pins/check_vllm_stack.py
  to: /opt/mad/pins/check_vllm_stack.py
system_packages:
- git
- build-essential
- cmake
- ninja-build
- ccache
- libssl-dev
- pkg-config
env:
  PIP_CONSTRAINT: /etc/pip-constraints.txt
  MORI_GPU_ARCHS: '{gpu_arch}'
  BUILD_UMBP: 'OFF'
  BUILD_UMBP_SPDK: 'OFF'
  VLLM_TARGET_DEVICE: rocm
  PYTORCH_ROCM_ARCH: '{gpu_arch}'
  MAX_JOBS: '32'
  NVCC_THREADS: '8'
  LD_LIBRARY_PATH: /usr/local/ucx/lib:/usr/local/lib:/usr/local/RIXL/install/lib:$LD_LIBRARY_PATH
  PATH: /usr/local/ucx/bin:$PATH
  AITER_JIT_DIR: /opt/vllm_cache/aiter_jit
  VLLM_CACHE_ROOT: /opt/vllm_cache/vllm
  TRITON_CACHE_DIR: /opt/vllm_cache/triton
  COMGR_CACHE_DIR: /opt/vllm_cache/comgr
variants:
  gfx942:
    setup:
    - sed -i 's|http://|https://|g' /etc/apt/sources.list 2>/dev/null || true
    - sed -i 's|http://|https://|g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
    - mkdir -p /app /opt/mad/pins
    - printf '%s\n' PIN_SET=vllm-kimi-k3 GPU_ARCH=gfx942 MAX_JOBS=32 NVCC_THREADS=8 NIC_ARCH=cx7 'PIP_CONSTRAINTS='"'"'setuptools<80'"'"'' PIP_AFTER_ENGINE=pyyaml 'PIP_EARLY='"'"''"'"'' 'PIP_EARLY_UPGRADE='"'"''"'"'' MORI_BUILD=1 MORI_REPO=https://github.com/ROCm/mori.git MORI_COMMIT=fe12a11a7d6c6acd0771b772366ed9ed5e0d3d44 AITER_KIND=source 'AITER_WHEEL_URL='"'"''"'"'' 'AITER_VERSION='"'"''"'"'' AITER_REPO=https://github.com/ROCm/aiter.git AITER_COMMIT=68e42f5f461556596ae294200f1a3f13378c8582 'AITER_PATCHES='"'"''"'"'' AITER_ARCH_ENV=1 AITER_CHECK_CONV=1 FLYDSL_VERSION=0.2.4 'FLYDSL_PIP_FLAGS='"'"'--no-deps --force-reinstall'"'"'' VLLM_REPO=https://github.com/vllm-project/vllm.git VLLM_COMMIT=9a7ae4b80866a322678ece31ca2854d9a174ab8d VLLM_PATCHES=/opt/mad/patches/vllm/kimi-k3.patch ROUTER_REPO=https://github.com/vllm-project/router.git ROUTER_COMMIT=1d10e71fb7bb4c0adc9f2c16ec77bf5dd4aa1586 ROUTER_PATCHES=/opt/mad/patches/router/dp-rank-kv-notify.patch RUST_TOOLCHAIN=1.88.0 TRANSPORTS_BUILD=1 UCX_REPO=https://github.com/ROCm/ucx.git UCX_COMMIT=da3fac2afcb55df7605f619ee19b37f4505bd4e4 RIXL_REPO=https://github.com/ROCm/RIXL.git RIXL_COMMIT=f33a5599400eb8da47ecdad20111ccb35b41a709 ROCSHMEM_REPO=https://github.com/ROCm/rocm-systems.git ROCSHMEM_COMMIT=9c43b23229cf2f835b838f72c0d1af3d4876167c DEEPEP_REPO=https://github.com/ROCm/DeepEP.git DEEPEP_COMMIT=0f63d3e97f0e43b47926179d7f3f304b3bc9554e GTEST_TARBALL=https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz > /opt/mad/pins/build.env
    - printf 'PIN_SET=%s\nGPU_ARCH=%s\nBASE_IMAGE=%s\n' vllm-kimi-k3 gfx942 rocm/vllm-dev:ci_base-0fcd9b99cc9d63202da4c858d8ebc6582c9e2491@sha256:c08a4e70734b41c8f5a876af07d8b3f705cecd262d21e5f6483ad48ca554d298 > /app/versions.txt
    - printf '%s\n' 'setuptools<80' > /etc/pip-constraints.txt
    - pip install meson==0.64.0 'pybind11[global]' tqdm prettytable
  gfx950:
    setup:
    - sed -i 's|http://|https://|g' /etc/apt/sources.list 2>/dev/null || true
    - sed -i 's|http://|https://|g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
    - mkdir -p /app /opt/mad/pins
    - printf '%s\n' PIN_SET=vllm-kimi-k3 GPU_ARCH=gfx950 MAX_JOBS=32 NVCC_THREADS=8 NIC_ARCH=cx7 'PIP_CONSTRAINTS='"'"'setuptools<80'"'"'' PIP_AFTER_ENGINE=pyyaml 'PIP_EARLY='"'"''"'"'' 'PIP_EARLY_UPGRADE='"'"''"'"'' MORI_BUILD=1 MORI_REPO=https://github.com/ROCm/mori.git MORI_COMMIT=fe12a11a7d6c6acd0771b772366ed9ed5e0d3d44 AITER_KIND=source 'AITER_WHEEL_URL='"'"''"'"'' 'AITER_VERSION='"'"''"'"'' AITER_REPO=https://github.com/ROCm/aiter.git AITER_COMMIT=68e42f5f461556596ae294200f1a3f13378c8582 'AITER_PATCHES='"'"''"'"'' AITER_ARCH_ENV=1 AITER_CHECK_CONV=1 FLYDSL_VERSION=0.2.4 'FLYDSL_PIP_FLAGS='"'"'--no-deps --force-reinstall'"'"'' VLLM_REPO=https://github.com/vllm-project/vllm.git VLLM_COMMIT=9a7ae4b80866a322678ece31ca2854d9a174ab8d VLLM_PATCHES=/opt/mad/patches/vllm/kimi-k3.patch ROUTER_REPO=https://github.com/vllm-project/router.git ROUTER_COMMIT=1d10e71fb7bb4c0adc9f2c16ec77bf5dd4aa1586 ROUTER_PATCHES=/opt/mad/patches/router/dp-rank-kv-notify.patch RUST_TOOLCHAIN=1.88.0 TRANSPORTS_BUILD=1 UCX_REPO=https://github.com/ROCm/ucx.git UCX_COMMIT=da3fac2afcb55df7605f619ee19b37f4505bd4e4 RIXL_REPO=https://github.com/ROCm/RIXL.git RIXL_COMMIT=f33a5599400eb8da47ecdad20111ccb35b41a709 ROCSHMEM_REPO=https://github.com/ROCm/rocm-systems.git ROCSHMEM_COMMIT=9c43b23229cf2f835b838f72c0d1af3d4876167c DEEPEP_REPO=https://github.com/ROCm/DeepEP.git DEEPEP_COMMIT=0f63d3e97f0e43b47926179d7f3f304b3bc9554e GTEST_TARBALL=https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz > /opt/mad/pins/build.env
    - printf 'PIN_SET=%s\nGPU_ARCH=%s\nBASE_IMAGE=%s\n' vllm-kimi-k3 gfx950 rocm/vllm-dev:ci_base-0fcd9b99cc9d63202da4c858d8ebc6582c9e2491@sha256:c08a4e70734b41c8f5a876af07d8b3f705cecd262d21e5f6483ad48ca554d298 > /app/versions.txt
    - printf '%s\n' 'setuptools<80' > /etc/pip-constraints.txt
    - pip install meson==0.64.0 'pybind11[global]' tqdm prettytable
components:
  mori: fe12a11a@di
  amd-aiter: 68e42f5f+flydsl0.2.4@di
  vllm: 9a7ae4b8+cd0d2656@vllm-kimi-k3
  vllm-router: 1d10e71f+0cc1c443@di
  ucx: da3fac2a@di
  googletest: v1.14.0@di
  rixl: f33a5599@di
  rocshmem: 9c43b232@di
  deepep: 0f63d3e9@di-cx7
order:
- mori
- amd-aiter
- vllm
- vllm-router
- ucx
- googletest
- rixl
- rocshmem
- deepep
finish:
- python3 /opt/mad/pins/check_vllm_stack.py all
- rm -rf /root/.mori /tmp/mori_jit_* && mkdir -p /root/.mori
- echo JIT_SCRUBBED=1 >> /app/versions.txt
- cat /app/versions.txt

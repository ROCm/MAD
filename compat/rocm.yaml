# Compatibility matrix: the ROCm capabilities MAD authorizes.
#
# A workload's scripts/<dir>/image_spec.yaml selects from this file; what a spec
# selects is what that workload is locked to. madengine adds every build a
# selection requires (requires:), orders all of them so each installs after what
# it requires, and fails before building if a requirement has no authorized build.
#
# Component builds are keyed "<version>@<origin>": the same version can exist as
# different builds, one per framework stack, and each is a separate capability.
# An entry installs as an exact wheel (url), a pip requirement against a named
# index (requirement + index), or a pinned source build (source). "{gpu_arch}"
# becomes the target (TheRock "device-all" when unknown). Shell variables in
# source steps are written $VAR, or \${VAR:-default}: ${...} is interpolation.
#
# Index locations: https://github.com/ROCm/TheRock/blob/main/RELEASES.md and
# docs/packaging/legacy_multi_arch_releases.md; frameworks wheels from
# https://rocm.frameworks.amd.com/whl-multi-arch/ (madengine stack harvest).

bare_os_base: ubuntu:24.04
default_release: "10.1"

indexes:
  therock_multi_arch: https://repo.amd.com/rocm/whl-multi-arch/
  therock_stable: https://stable.repo.amd.com/rocm/whl-next/
  therock_nightly: https://nightly.repo.amd.com/rocm/whl-next/
  frameworks_vllm: https://rocm.frameworks.amd.com/whl-multi-arch/vllm/

# ROCm releases. TheRock entries name their index and pin the release, because
# an index serves every release in its stream; the pin also keeps torch and
# rocm-sdk-devel on the same release.
releases:
  "7.2":
    default_install: legacy
    legacy_installer_url: https://repo.radeon.com/amdgpu-install/7.2/ubuntu/noble/amdgpu-install_7.2.70200-1_all.deb
  "7.13":
    default_install: therock
    index: therock_multi_arch
    pip_spec: ">=7.13,<7.14"
  "7.14":
    default_install: therock
    index: therock_multi_arch
    pip_spec: ">=7.14,<7.15"
  "10.0":
    default_install: therock
    index: therock_stable
    pip_spec: ">=10.0,<10.1"
  "10.1":
    default_install: therock
    index: therock_stable
    pip_spec: ">=10.1,<10.2"
  nightly:
    default_install: therock
    index: therock_nightly

components:
  torch:
    "2.13.0+rocm10.1.0":
      index: therock_stable
      requirement: "torch[device-{gpu_arch}]==2.13.0+rocm10.1.0"
      requires: ["rocm>=10.1,<10.2"]
    "2.13.0+rocm10.0.0":
      index: therock_stable
      requirement: "torch[device-{gpu_arch}]==2.13.0+rocm10.0.0"
      requires: ["rocm>=10.0,<10.1"]

  torchvision:
    "0.28.0+rocm10.1.0":
      index: therock_stable
      requirement: "torchvision[device-{gpu_arch}]==0.28.0+rocm10.1.0"
      requires: ["torch==2.13.0+rocm10.1.0"]
      note: The torchvision release paired with torch 2.13; pinned so pip cannot take a build for another ROCm release.

  amd-aiter:
    "0.1.22.post2.dev0+gb4d9154d1.d20261002@frameworks-vllm":
      url: https://rocm.frameworks.amd.com/whl-multi-arch/vllm/amd-aiter/amd_aiter-0.1.22.post2.dev0%2Bgb4d9154d1.d20261002-cp314-cp314-linux_x86_64.whl
      built_by: frameworks/vllm
      python: ["3.14"]
      requires: ["torch==2.13.0+rocm10.1.0"]
      note: Torch extension; the wheel does not declare torch, the frameworks vllm stack builds it against 2.13.0+rocm10.1.0.

  flash-attn:
    "2.8.3@frameworks-vllm":
      url: https://rocm.frameworks.amd.com/whl-multi-arch/vllm/flash-attn/flash_attn-2.8.3-cp314-cp314-linux_x86_64.whl
      built_by: frameworks/vllm
      python: ["3.14"]
      requires: ["torch==2.13.0+rocm10.1.0"]

  vllm:
    "0.29.1.dev0+rocm10.1.0.g98dff2a81.d20261002@frameworks-vllm":
      url: https://rocm.frameworks.amd.com/whl-multi-arch/vllm/vllm/vllm-0.29.1.dev0%2Brocm10.1.0.g98dff2a81.d20261002-cp314-cp314-linux_x86_64.whl
      built_by: frameworks/vllm
      python: ["3.14"]
      requires:
        - "torch==2.13.0+rocm10.1.0"  # not declared by the wheel: vllm 98dff2a81 builds against torch == 2.13.0
        - "amd-aiter==0.1.22.post2.dev0+gb4d9154d1.d20261002"
        - "flash-attn==2.8.3"
        - "torchvision==0.28.0+rocm10.1.0"  # vllm requires torchvision unpinned
      exclude:
        - name: amd-quark
          reason: vllm pins amd-quark==0.12.post1, whose only build requires python <3.14, and this vllm exists only for cp314; Quark-quantized models fail until a 3.14-compatible amd-quark is published

  # KV-cache transfer backends, built from source on the SGLang ROCm 10 image
  # (see scripts/kvcache_transfer_bench/image_spec.yaml).
  mori:
    "1.2.3.post1@kvcache":
      source:
        repo: https://github.com/ROCm/mori.git
        commit: 67632e80e2e492184b589904b63225f82d45537c
        path: /sgl-workspace/mori
        steps:
          - pip install -r requirements-build.txt Cython
          - MORI_GPU_ARCHS="\${GPU_ARCH_LIST:-{gpu_arch}}" pip install --no-build-isolation -e .
          - cmake -B build_bench -DCMAKE_PREFIX_PATH="\${ROCM_PATH:-/opt/rocm}/lib/rocm_sysdeps" -DUSE_ROCM=ON -DCMAKE_BUILD_TYPE=Release -DGPU_TARGETS="\${GPU_ARCH_LIST:-{gpu_arch}}" -DBUILD_IO=ON -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARK=OFF -DBUILD_UMBP=OFF -DWITH_MPI=OFF -DBUILD_XLA_FFI_OPS=OFF
          - cmake --build build_bench --target bench_engine -j $(nproc)
          - $MORI_IO_BENCH_ENGINE_BIN --help > /dev/null
      system_packages: [ibverbs-utils, libibverbs-dev, openmpi-bin, libopenmpi-dev, libpci-dev, libdw1, locales, libgrpc-dev, libgrpc++-dev, libprotobuf-dev, protobuf-compiler-grpc, cmake, libdrm-dev]
      note: Python package and the MoRI-IO C++ bench_engine from one checkout.

  mooncake:
    "0.3.13.post1@kvcache":
      source:
        repo: https://github.com/kvcache-ai/Mooncake.git
        commit: 719735896c86b56fabec6cf3e825fb2ea640597a
        path: /sgl-workspace/Mooncake
        steps:
          - rm -rf /usr/local/go
          - bash dependencies.sh -y
          - mkdir build && cd build && cmake .. -DBUILD_SHARED_LIBS=ON -DUSE_HIP=ON -DENABLE_MULTI_PROTOCOL=ON -DUSE_HTTP=ON -DUSE_ETCD=ON -DSTORE_USE_ETCD=ON -DBUILD_UNIT_TESTS=OFF && make -j16 && make install
          - pip install uv && uv venv --seed /tmp/mooncake-wheel-venv
          - PATH="/tmp/mooncake-wheel-venv/bin:$PATH" LD_LIBRARY_PATH="$MOONCAKE_HOME/build/mooncake-asio:$LD_LIBRARY_PATH" ./scripts/build_wheel.sh
          - rm -rf /tmp/mooncake-wheel-venv
          - pip uninstall -y mooncake-transfer-engine mooncake-transfer-engine-non-cuda
          - rm -rf "$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/mooncake"
          - pip install --no-cache-dir mooncake-wheel/dist/*.whl
          - python3 -c 'from mooncake.engine import TransferEngine'
          - cp build/mooncake-transfer-engine/benchmark/tebench /usr/local/bin/
      note: ENABLE_MULTI_PROTOCOL=ON is required with USE_HIP=ON; without it cross-node writes go to HIP IPC and fail.

  ucx:
    "da3fac2a@rocm":
      source:
        repo: https://github.com/ROCm/ucx.git
        commit: da3fac2a
        path: /sgl-workspace/ucx
        steps:
          - if dpkg -s libabsl-dev >/dev/null 2>&1; then apt-get remove -y libabsl-dev; fi
          - ./autogen.sh
          - mkdir build && cd build && ../configure --prefix=$UCX_HOME --enable-shared --disable-static --disable-doxygen-doc --enable-optimizations --enable-devel-headers --with-rocm=/opt/rocm --with-verbs --with-dm --enable-mt --without-go && make -j && make install

  nixl:
    "1.4.1+pr2191@kvcache":
      requires: ["ucx"]
      source:
        repo: https://github.com/ai-dynamo/nixl.git
        commit: 778edd1d1a50936b12c264879e12ef465e629002
        cherry_pick: [fe3244c875ee4a22da6b0140c94c334546e9b715]
        path: /sgl-workspace/nixl
        steps:
          - pip install meson meson-python patchelf tomlkit uv
          - pip uninstall -y nixl nixl-rocm nixl-cu12 nixl-cu13
          - SITE=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])') && rm -rf "$SITE/nixl" "$SITE/nixl_rocm"
          - meson setup build --prefix=$NIXL_HOME -Ducx_path=$UCX_HOME -Dwheel_variant=rocm -Denable_plugins=UCX
          - ninja -C build install
          - ./contrib/tomlutil.py --wheel-name nixl-rocm pyproject.toml
          - pip install --no-cache-dir --no-build-isolation . -Csetup-args=-Ducx_path=$UCX_HOME -Csetup-args=-Dwheel_variant=rocm -Csetup-args=-Denable_plugins=UCX
          - pip install --no-cache-dir --no-deps build/src/bindings/python/nixl-meta/nixl-*-py3-none-any.whl
          - python3 -c "from nixl._api import nixl_agent, nixl_agent_config; assert 'UCX' in nixl_agent('probe', nixl_agent_config(backends=[])).get_plugin_list()"
          - wget -q https://github.com/etcd-io/etcd/releases/download/v3.6.0-rc.5/etcd-v3.6.0-rc.5-linux-amd64.tar.gz -O /tmp/etcd.tar.gz
          - mkdir -p /usr/local/bin/etcd && tar -xf /tmp/etcd.tar.gz -C /usr/local/bin/etcd --strip-components=1 && rm /tmp/etcd.tar.gz
      note: v1.4.1 plus ai-dynamo/nixl#2191 (ROCm fix, not in v1.4.1). Replaces any NIXL the base ships.

# ---------------------------------------------------------------------------------------
# Hardware and number-format capabilities (MAD scripts/common/recipe/recipe.py).
#
# A recipe (scripts/<dir>/models.yaml) states what each serving role needs -- the weight,
# activation and KV-cache formats, where the weights live -- in the vendor-neutral names
# below. Resolving it for a run checks those needs against the accelerator the run gets and
# the engine build the image carries, and turns them into the engine's own arguments; a need
# nobody can meet is refused by name before anything is allocated. Every capability names
# its evidence: a recipe that runs on it, a document, or a source the engine build carries.
# ---------------------------------------------------------------------------------------

# Number formats, by what they are, not by who named them.
formats:
  bf16:          {bits: 16, family: bf16}
  fp16:          {bits: 16, family: fp16}
  fp8_e4m3:      {bits: 8, family: fp8, note: OCP FP8 E4M3 (e4m3fn)}
  fp8_e4m3fnuz:  {bits: 8, family: fp8, note: FP8 E4M3 with no negative zero; CDNA 3 native}
  fp8_e5m2:      {bits: 8, family: fp8}
  mxfp8:         {bits: 8, family: mx, block: 32, scale: e8m0, note: OCP microscaling}
  mxfp6:         {bits: 6, family: mx, block: 32, scale: e8m0, note: OCP microscaling}
  mxfp4:         {bits: 4, family: mx, block: 32, scale: e8m0, note: OCP microscaling}
  nvfp4:         {bits: 4, family: fp4, block: 16, scale: fp8_e4m3, note: NVIDIA FP4 with FP8 block scales}
  int4_g32:      {bits: 4, family: int, block: 32, scale: fp16, weight_only: true, note: packed int4 per group of 32 ("int4_per_group_32")}
  int8:          {bits: 8, family: int}
  lut3:          {bits: 3, family: lut, weight_only: true, note: codebook (non-uniform) weights}
  lut2:          {bits: 2, family: lut, weight_only: true, note: codebook (non-uniform) weights}

# A format family a recipe may name instead of an exact format: the run takes the
# accelerator's native member of the family ("fp8" is e4m3fnuz on CDNA 3, e4m3 on CDNA 4).
format_families: [bf16, fp16, fp8, mx, fp4, int, lut]

# GPU architectures, by compiler target. `matmul` is what the matrix cores compute on
# natively; anything else needs a conversion an engine build must provide (kernels below).
accelerators:
  gfx942:
    generation: CDNA 3
    products: {MI300X: {hbm_gb: 192, hbm_tbps: 5.3}, MI325X: {hbm_gb: 256, hbm_tbps: 6.0}}
    # Peak dense matrix TFLOPS per GPU (vendor figures; the performance model is calibrated on runs).
    peak_tflops: {bf16: 1307, fp8: 2615}
    wave_size: 64
    matmul: [bf16, fp16, fp8_e4m3fnuz, fp8_e5m2, int8]
    # logical GPUs per package in each compute-partition mode (8 XCDs)
    partitions: {SPX: 1, DPX: 2, QPX: 4, CPX: 8}
    evidence: >-
      scripts/vllm_dissag/models.yaml (Kimi-K3 on MI300X): "gfx942 has no scaled-MXFP4 MFMA",
      FP8 KV cache in every MI300X disagg recipe.
  gfx950:
    generation: CDNA 4
    products: {MI350X: {hbm_gb: 288, hbm_tbps: 8.0}, MI355X: {hbm_gb: 288, hbm_tbps: 8.0}}
    peak_tflops: {bf16: 2500, fp8: 5000, mxfp4: 10000}   # MI355X; vendor peak, to calibrate
    wave_size: 64
    matmul: [bf16, fp16, fp8_e4m3, fp8_e5m2, mxfp8, mxfp6, mxfp4, int8]
    # logical GPUs per package in each compute-partition mode (8 XCDs)
    partitions: {SPX: 1, DPX: 2, QPX: 4, CPX: 8}
    evidence: >-
      scripts/vllm_dissag/models.yaml (Kimi-K3-MXFP4-MI355X): "gfx950 has scaled-MXFP4 MFMA";
      AMD CDNA 5 white paper (MI355X memory 288 GB HBM3E, 8 TB/s).
  cdna5:
    generation: CDNA 5
    target: tbd                     # compiler target not published yet; resolution works on this key
    products: {MI455X: {hbm_gb: 432, hbm_tbps: 23.3}}
    peak_tflops: {fp8: 20000, mxfp4: 40000}   # from the Helios rack figures / 72; vendor peak, to calibrate
    wave_size: 32
    matmul: [bf16, fp16, fp8_e4m3, mxfp8, mxfp6, mxfp4]
    mx_block_sizes: [16, 32]
    mx_fractional_scale: true
    # modes named in the white paper; logical GPUs per mode not stated, so not assumed
    partitions: {SPX: 1, DPX: null, QPX: null, CPX: null}
    coherent_host_link_gbps: 256
    scale_up: {fabric: UALoE, gpus_per_domain: 72, tbps_per_gpu: 3.6}
    evidence: AMD CDNA 5 white paper (2026). NVFP4 is not listed as native; it is not assumed.

# What an engine build supports per target: weight, activation and KV-cache formats, where
# weights can live, and conversions it performs (a format the target cannot compute on,
# requantized to one it can). Keyed by engine and build (today: the pin set it is built from,
# docker/pins/<name>.json).
kernels:
  vllm@vllm-kimi-k3:
    gfx942:
      weights: [bf16, fp8_e4m3fnuz, int4_g32]
      activations: [bf16, fp8_e4m3fnuz]
      kv_cache: [bf16, fp8_e4m3fnuz]
      convert: {mxfp4: int4_g32}
      placement: [hbm]
      evidence: Kimi-K3 / Kimi-K3-MXFP4 2P2D on MI300X (MoE requantized to int4 for SiTUv2)
    gfx950:
      weights: [bf16, fp8_e4m3, mxfp4]
      activations: [bf16, fp8_e4m3, mxfp4]
      kv_cache: [bf16, fp8_e4m3]
      placement: [hbm]
      evidence: Kimi-K3-MXFP4-MI355X (bring-up recipe, not validated)
  vllm@vllm-mori121:
    gfx942:
      weights: [bf16, fp8_e4m3fnuz]
      activations: [bf16, fp8_e4m3fnuz]
      kv_cache: [bf16, fp8_e4m3fnuz]
      placement: [hbm]
      evidence: DeepSeek-V3/R1 and Llama FP8 disagg cards on MI300X
  vllm@vllm-glm51:
    gfx942:
      weights: [bf16, fp8_e4m3fnuz]
      activations: [bf16, fp8_e4m3fnuz]
      kv_cache: [bf16, fp8_e4m3fnuz]
      placement: [hbm]
      evidence: GLM-5.1-FP8 2P/2D and 4P/4D on MI300X
  sglang@sglang-disagg:
    gfx942:
      weights: [bf16, fp8_e4m3fnuz]
      activations: [bf16, fp8_e4m3fnuz]
      kv_cache: [bf16]
      placement: [hbm]
      evidence: sglang_disagg Llama / Qwen3 / Mixtral (BF16) and Llama FP8, DeepSeek-V3/R1 (FP8) cards on MI300X
    gfx950:
      weights: [bf16, fp8_e4m3]
      activations: [bf16, fp8_e4m3]
      kv_cache: [bf16]
      placement: [hbm]
      evidence: the same cards on MI355X (SGLang release image for gfx950)

# How each engine is told a format: the arguments a resolved role gets. A value of `auto` is the
# engine's default and needs no argument.
engines:
  vllm:
    # The KV-cache format reaches vLLM as KV_CACHE_DTYPE (the wide-EP role scripts pass it on as
    # --kv-cache-dtype) or as --kv-cache-dtype in a recipe's flags (the TP path); either agrees.
    kv_cache_env: KV_CACHE_DTYPE
    kv_cache_arg: --kv-cache-dtype
    kv_cache_values: {bf16: auto, fp8: fp8}
    convert_args:
      int4_g32: --quantization-config '{"moe":{"weight":"int4_per_group_32"}}'
  sglang:
    kv_cache_arg: --kv-cache-dtype
    kv_cache_values: {bf16: auto}

# ----------------------------------------------------------------------------------------------
# Fabrics: the scale-out NIC families a site may have, as data. scripts/common/cluster.sh fills
# what a run does not pass from the family it detects (scripts/common/platform/fabric.py); an
# explicit value always wins. `match`: substrings of RDMA device or driver names that identify the
# family, tried in fabric_detection.order. `rails`: the driver whose devices are the GPU rails
# (found on the node), and the names to use when the node cannot be read; none: the connectors
# keep their own choice.
fabric_detection:
  order: [thor2, ainic, cx7]
  unknown: cx7          # a node nothing matches behaves as before the families existed
fabrics:
  cx7:
    description: NVIDIA (Mellanox) ConnectX-7, RoCE
    match: [mlx5]
    gid_index: 3
    socket_ifname: eth0
    rdma_drivers: mlx5
    kv_nic: mlx5_1        # the management NIC: cross-rail safe for KV transfer
    # The rails of the CX7 site the connectors were validated on; on cx7 the connectors choose
    # (rixl.sh probes ibstat first), so cluster.sh passes these as MAD_FABRIC_RAILS only.
    rails: {default: [mlx5_0, mlx5_2, mlx5_3, mlx5_4, mlx5_5, mlx5_7, mlx5_8, mlx5_9], connectors_choose: true}
    rdma_qos: {tc: 41, sl: 0}   # RoCE DSCP for lossless RDMA, as every family ran with so far; set per site
  ainic:
    description: AMD AI NIC (Pollara), RoCE
    match: [rdma, ionic]
    gid_index: 1
    socket_ifname: eno0
    rdma_drivers: ionic
    kv_nic: rdma0
    rails: {driver: ionic, default: [rdma0, rdma1, rdma2, rdma3, rdma4, rdma5, rdma6, rdma7]}
    env: {RCCL_AINIC_ROCE: "1"}     # without it the AINIC path falls back to verbs/sockets silently
    rdma_qos: {tc: 41, sl: 0}
  thor2:
    description: Broadcom Thor2, RoCE
    match: [bnxt_re, bnxt_en]
    gid_index: 3
    socket_ifname: fenic0
    rdma_drivers: bnxt_re
    kv_nic: bnxt_re0
    rails: {driver: bnxt_en, default: [bnxt_re0, bnxt_re1, bnxt_re2, bnxt_re3, bnxt_re4, bnxt_re5, bnxt_re6, bnxt_re7]}
    rdma_qos: {tc: 41, sl: 0}

# Scale-up fabrics: the domain inside which tensor/expert-parallel traffic belongs.
scale_up_fabrics:
  xgmi:
    description: Infinity Fabric links between the GPUs of one node
    scope: node
  ualoe:
    description: UALink over Ethernet, switched across a rack (CDNA 5 white paper)
    scope: rack
    switched: true

# Platforms: a node type -- its accelerator, GPUs per node, NICs and their GPU affinity, scale-up.
# nics_per_gpu counts the scale-out NICs serving each GPU (rails), each nic_gbps (Gb/s); scale_up
# gbps_per_gpu is GB/s. Link speeds are vendor figures for the performance model. A run names its platform with
# MAD_PLATFORM (scripts/common/platform/platform.py); cluster.sh then takes GPUS_PER_NODE from it
# and the GPU probe verifies the accelerator and the GPU count. default_platform: the shape a run
# that names none gets (not verified: it says only how many GPUs to use per node).
default_platform: mi300x-oam-8
platforms:
  mi300x-oam-8:
    accelerator: gfx942
    product: MI300X
    gpus_per_node: 8
    scale_up: {fabric: xgmi, gpus_per_domain: 8, gbps_per_gpu: 896}   # GB/s, peer links per GPU
    nics_per_gpu: 1
    nic_gbps: 400
  mi325x-oam-8:
    accelerator: gfx942
    product: MI325X
    gpus_per_node: 8
    scale_up: {fabric: xgmi, gpus_per_domain: 8, gbps_per_gpu: 896}
    nics_per_gpu: 1
    nic_gbps: 400
  mi355x-ubb-8:
    accelerator: gfx950
    product: MI355X
    gpus_per_node: 8
    scale_up: {fabric: xgmi, gpus_per_domain: 8, gbps_per_gpu: 1075}
    nics_per_gpu: 1
    nic_gbps: 400
  mi455x-helios-tray:
    accelerator: cdna5
    product: MI455X
    gpus_per_node: 4
    scale_up: {fabric: ualoe, gpus_per_domain: 72, gbps_per_gpu: 3600}
    nics_per_gpu: 3
    nic_gbps: 800
    coherent_host_link: true
    evidence: CDNA 5 white paper (Helios rack); not yet available to run on

# Clusters: a site -- its platform, fabric family, and the site defaults a run gets when it passes
# none (storage roots, subnet). A run names one with MAD_CLUSTER (an entry here) or MAD_CLUSTER_FILE
# (a file of the same shape, kept with the site rather than in this public repository); cluster.sh
# applies it before its own fallbacks, and anything the run passes wins. These entries are examples.
clusters:
  example-slurm-mi300x-cx7:
    scheduler: slurm
    platform: mi300x-oam-8
    fabric: cx7
    env: {SHARED_MOUNT: /shared_inference, NVME_ROOT: /mnt/nvme}
  example-slurm-mi355x-ainic:
    scheduler: slurm
    platform: mi355x-ubb-8
    fabric: ainic
    env: {SHARED_MOUNT: /shared, NVME_ROOT: /mnt/nvme}

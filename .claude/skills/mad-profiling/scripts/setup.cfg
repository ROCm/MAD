[flake8]
# The reports are prose-heavy, so lines run wider than PEP 8's default; 100 is what the tooling has
# always used. Declared here so the next contributor has a rule rather than a guess.
max-line-length = 100
exclude = .pytest_cache,__pycache__

[tool:pytest]
# `tests/conftest.py` puts `scripts/` on sys.path, so the suite runs from this directory with no
# installation step: python3 -m pytest tests -q
testpaths = tests

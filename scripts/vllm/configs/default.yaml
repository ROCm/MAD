# 1k 1k mc1 mc8 mc32 mc128

## Split so each model matches its own perf.yaml entry (overrides are matched per base entry)
- benchmark: serving
  hf_pipeline_tag: text-generation
  model: deepseek-ai/DeepSeek-R1-0528
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128

- benchmark: serving
  hf_pipeline_tag: text-generation
  model: amd/DeepSeek-R1-0528-MXFP4
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128

- benchmark: serving
  hf_pipeline_tag: text-generation
  model: moonshotai/Kimi-K2.6
  tp: 4 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128
  env:
    VLLM_ROCM_USE_AITER: 1
  arch_overrides:
    # MI300 cannot fit TP4, override to TP8 only
    gfx942:
      tp: 8

- benchmark: serving
  hf_pipeline_tag: text-generation
  model: amd/Kimi-K2.6-MXFP4
  tp: 4 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128
  env:
    VLLM_ROCM_USE_AITER: 1
  arch_overrides:
    # MI300 cannot fit TP4, override to TP8 only
    gfx942:
      tp: 8


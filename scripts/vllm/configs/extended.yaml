## Qwen 235B requires --enable-expert-parallel with tp 8
- benchmark: serving
  model:
    Qwen/Qwen3-235B-A22B-Thinking-2507
    Qwen/Qwen3-235B-A22B-Thinking-2507-FP8
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  env:
    VLLM_ROCM_USE_AITER: 1
  extra_args:
    --enable-expert-parallel: True
  arch_overrides:
    gfx942:
      dtype: float16
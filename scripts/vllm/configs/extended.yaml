# 1k 1k mc1

- benchmark: serving
  hf_pipeline_tag: text-generation
  model:
    openai/gpt-oss-20b
  tp: 1
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1

- benchmark: serving
  hf_pipeline_tag: text-generation
  model:
    meta-llama/Llama-3.1-8B-Instruct
    amd/Llama-3.1-8B-Instruct-FP8-KV
    Qwen/Qwen3-8B
    Qwen/Qwen3-32B
    Qwen/Qwen3-30B-A3B-Thinking-2507
    Qwen/Qwen3-30B-A3B-Thinking-2507-FP8
  tp: 1
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  arch_overrides:
    gfx942:
      dtype: float16

- benchmark: serving
  hf_pipeline_tag: text-generation
  model:
    mistralai/Mixtral-8x7B-Instruct-v0.1
    amd/Mixtral-8x7B-Instruct-v0.1-FP8-KV
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  arch_overrides:
    gfx942:
      dtype: float16

## Qwen 235B / 3.5 397B require --enable-expert-parallel with tp 8 (see perf.yaml)
# Keep Qwen in bf16 on gfx942; Qwen 3.5 exceeds fp16 boundaries and breaks accuracy
- benchmark: serving
  hf_pipeline_tag: text-generation
  model:
    Qwen/Qwen3-235B-A22B-Thinking-2507
    Qwen/Qwen3-235B-A22B-Thinking-2507-FP8
    Qwen/Qwen3.5-397B-A17B
    Qwen/Qwen3.5-397B-A17B-FP8
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1

- benchmark: serving
  hf_pipeline_tag: text-generation

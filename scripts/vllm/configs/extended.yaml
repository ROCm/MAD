# 1k 1k mc1

## gpt-oss requires AITER unified attention and performs best with block-size 64
- benchmark: serving
  model:
    openai/gpt-oss-20b
  tp: 1
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  env:
    VLLM_ROCM_USE_AITER: 1
  bench_args:
    --lmeval_apply_chat_template: True

- benchmark: serving
  model:
    meta-llama/Llama-3.1-8B-Instruct
    amd/Llama-3.1-8B-Instruct-FP8-KV
    microsoft/phi-4
    Qwen/Qwen3-8B
    Qwen/Qwen3-32B
    Qwen/Qwen3-30B-A3B-Thinking-2507
    Qwen/Qwen3-30B-A3B-Thinking-2507-FP8
  tp: 1
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1
  env:
    VLLM_ROCM_USE_AITER: 1
  arch_overrides:
    gfx942:
      dtype: float16


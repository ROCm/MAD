## Kimi K2.6 MXFP4 (AITER). Different checkpoint from the INT4 runs.
- model: amd/Kimi-K2.6-MXFP4
  env:
    VLLM_ROCM_USE_AITER: 1

## DeepSeek-V3.2-MXFP4 / GLM-5.2 (AITER + fp8 KV cache + max-model-len for GLM 5.2 1M context)
- model:
    amd/DeepSeek-V3.2-MXFP4
    zai-org/GLM-5.2-FP8
    amd/GLM-5.2-MXFP4
  extra_args:
    --max-model-len: 101372
    --kv-cache-dtype: fp8
  env:
    VLLM_ROCM_USE_AITER: 1

## MiniMax-M3-MXFP8: vllm/vllm-openai-rocm:v0.31.0, 8x AMD Instinct MI350X, TP8
## Workload: ISL/OSL 8192/1024, concurrency 1-256, KV cache dtype = vLLM default, prefix caching off
- model: MiniMaxAI/MiniMax-M3-MXFP8
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_ROCM_AITER_MOE_DISPATCH_POLICY: 2
    AITER_USE_FLYDSL_MOE_SORTING: 1
    VLLM_ROCM_USE_AITER_TRITON_ROPE: 1
    VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
  extra_args:
    --language-model-only: true
    --block-size: 128
    --attention-backend: TRITON_ATTN
    --compilation-config: '{"pass_config": {"enable_sp": true, "sp_min_token_num": 16}, "cudagraph_capture_sizes": [8, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384, 512]}'

## MiniMax-M3 MXFP4 (AITER + TRITON_ATTN + fp8 KV cache)
- model: amd/MiniMax-M3-MXFP4
  extra_args:
    --block-size: 128
    --kv-cache-dtype: fp8
    --attention-backend: TRITON_ATTN
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 0
    VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: 1

- model: MiniMaxAI/MiniMax-M3.1-Flash
  docker_base: vllm/vllm-openai-rocm:minimax-m31-flash
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: 1
    VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: 1
    VLLM_ROCM_MINIMAX_M3_MONO: 1
  extra_args:
    --trust-remote-code: true
    --block-size: 128
    --kv-cache-dtype: fp8
    --attention-config: '{"indexer_kv_dtype": "fp8", "indexer_decode_cp": true}'
    --quantization-config.moe: mxfp4
    --disable-hybrid-kv-cache-manager: true
    --compilation-config.cudagraph_mode: FULL_DECODE_ONLY

## Cohere Command A+ bf16 (AITER)
- model: CohereLabs/command-a-plus-05-2026-bf16
  env:
    VLLM_ROCM_USE_AITER: 1

## MiMo-V2.6-Pro (AITER + fp8 KV + tool-call/reasoning parsers)
- model: XiaomiMiMo/MiMo-V2.6-Pro-MOPD XiaomiMiMo/MiMo-V2.6-Pro-RL
  extra_args:

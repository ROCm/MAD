## Kimi K2.6 INT4.
- model: moonshotai/Kimi-K2.6
  env:
    VLLM_ROCM_USE_AITER: 1
    VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: INT4
  extra_args:
    --trust-remote-code: true
    --attention-backend: ROCM_AITER_MLA
    --mm-encoder-tp-mode: data
    --moe-backend: flydsl
    --gpu-memory-utilization: 0.9

# Tie values together: one knob (POOL) sizes both pools, and the run's tags follow the shape. Change
# POOL (here, or at submit) and every value built from it follows.
version: 2
defaults: [deepseek-v3.yaml]
model:
  env:
    POOL: "2"
    xP: ${model.env.POOL}
    yD: ${model.env.POOL}
    PERF_TAGS: deepseek-v3,${model.env.xP}p${model.env.yD}d,${model.env.BENCHMARK_SCRIPT}

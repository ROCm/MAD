# Demo: shows the mechanism (per-role checkpoints and formats). The checkpoint names are
# placeholders for checkpoints you provide; nothing here has been run.
# Disaggregated quantization: FP4 W4A4 prefill and weight-only decode from separate checkpoints
# (per-role artifacts). Needs FP4 matrix compute: on gfx942 the launcher refuses before anything
# runs, naming the FP4 activations; on gfx950 each role serves its own checkpoint.
version: 2
defaults: [../../../common/workloads/family/deepseek-v3.yaml, ../../../common/workloads/bench/accuracy.yaml]
model:
  env: {MODEL_NAME: DeepSeek-V3-DQ, MODEL_WEIGHTS_NAME: DeepSeek-V3}

amd-Llama-3.3-70B-Instruct-FP8-KV:
  roles:                                # what every role needs (scripts/common/recipe/recipe.py)
    default: {quantization: {weights: fp8, activations: fp8}, kv_cache: fp8}
    prefill: {}
    decode: {}
  env:
    VLLM_USE_V1: "1"
    # --disable-custom-all-reduce (below) sends every TP all-reduce through RCCL, and on
    # MI300X RCCL takes its MSCCL path for them. During vLLM's compile/warmup MSCCL
    # allocated a 20 MiB scratch buffer per all-reduce and kept every one (msccl_setup.cc
    # :550, 1721 of them, 38.31 GiB on one GPU) until the GPU was full: "HIP failure: out
    # of memory" / "NCCL error: unhandled cuda error" on the first all-reduce, whatever
    # GPU_MEMORY_UTILIZATION was, in three runs. RCCL's standard
    # algorithms do not do this. The other TP recipes keep vLLM's custom all-reduce and
    # never reach this path.
    RCCL_MSCCL_ENABLE: "0"
    VLLM_V1_USE_PREFILL_DECODE_ATTENTION: "1"
    AMDGCN_USE_BUFFER_OPS: "1"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_USE_AITER_TRITON_ROPE: "1"
    TRITON_HIP_ASYNC_COPY_BYPASS_PERMUTE: "1"
    TRITON_HIP_USE_ASYNC_COPY: "1"
    TRITON_HIP_USE_BLOCK_PINGPONG: "1"
    TRITON_HIP_ASYNC_FAST_SWIZZLE: "1"
    # Per-role cudagraph (validated moriio+TP recipe): prefill eager, decode PIECEWISE
    # (the ITL win). Previously an image-level ENV default; now lives with the model.
    PREFILL_CUDAGRAPH_MODE: "NONE"
    DECODE_CUDAGRAPH_MODE: "PIECEWISE"
  prefill:
    tp: "--tensor-parallel-size 8 --max-model-len 65536 --kv-cache-dtype fp8 --disable-custom-all-reduce"
  decode:
    tp: "--tensor-parallel-size 8 --max-model-len 65536 --kv-cache-dtype fp8 --disable-custom-all-reduce"


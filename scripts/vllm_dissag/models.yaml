# Model catalog for vllm_disagg.sh (disaggregated PD).
# -----------------------------------------------------------------------------
# Selected by MODEL_NAME. PARALLEL_MODE is tp or dp, derived from WIDE_EP:
#   WIDE_EP=0 -> PARALLEL_MODE=tp -> base_flags + tp_flags + prefill.tp / decode.tp
#   WIDE_EP=1 -> PARALLEL_MODE=dp -> base_flags + dp_flags + prefill.dp / decode.dp
#
# Per model:
#   base_flags          always applied (both roles, both modes)
#   tp_flags / dp_flags mode-level, applied to BOTH roles (omit if empty)
#   prefill/decode.<tp|dp>  role+mode specific flags
#   experimental_flags  optional extra CLI flags
#   env: {VAR: val}     per-model ENV. Exported BEFORE the connector's setup_env, so it
#                       overrides connector defaults but still yields to a submit-time
#                       `-e VAR=...` (which wins). This is the SINGLE HOME for the model
#                       serving recipe (KV_BLOCK_SIZE, KV_CACHE_DTYPE, per-role
#                       PREFILL/DECODE_CUDAGRAPH_MODE, *_MORI_BACKEND, GPU_MEMORY_UTILIZATION,
#                       KV_CACHE_MEMORY_BYTES, VLLM_ROCM_USE_AITER_MLA, ...). The Docker image
#                       ships NONE of these — it is a clean binary/library artifact, so the
#                       same image serves any model/cluster. (Platform + MoRI fabric env lives
#                       in connectors/<connector>.env; both are forwarded via `docker -e`.)
#
# BOUNDARY — the launcher/connector owns the wideEP parallelism DEGREE and transport:
#   --data-parallel-size / --enable-expert-parallel / --all2all-backend /
#   --kv-transfer-config / --port / transfer backend are emitted by the connector.
# The tp: blocks DO carry --tensor-parallel-size (they reproduce the legacy
#   vllm_disagg_server.sh declare -A maps, where the degree lived in the map). The
#   moriio+TP path also emits its own --tensor-parallel-size, so it strips any
#   duplicate from the yaml tp: string; the rixl+TP path takes the degree from the yaml.
#
# NOTE on wideEP (dp) models: the moriio(mori) and rixl(deepep) connectors emit the
# validated wideEP serve flags (block-size, kv-cache-dtype, cudagraph, etc.) directly
# today, so the dp: blocks below are intentionally empty — placeholders so per-model
# dp: tuning can be added later without launcher edits (both connectors now append it).

# ============================ Dense / TP-capable ============================

Llama-3.1-405B-Instruct-FP8-KV:
  env:
    VLLM_USE_V1: "1"
    VLLM_V1_USE_PREFILL_DECODE_ATTENTION: "1"
    AMDGCN_USE_BUFFER_OPS: "1"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_USE_AITER_TRITON_ROPE: "1"
    TRITON_HIP_ASYNC_COPY_BYPASS_PERMUTE: "1"
    TRITON_HIP_USE_ASYNC_COPY: "1"
    TRITON_HIP_USE_BLOCK_PINGPONG: "1"
    TRITON_HIP_ASYNC_FAST_SWIZZLE: "1"
    PREFILL_CUDAGRAPH_MODE: "NONE"
    DECODE_CUDAGRAPH_MODE: "PIECEWISE"
  prefill:
    tp: "--tensor-parallel-size 8 --kv-cache-dtype fp8"
  decode:
    tp: "--tensor-parallel-size 8 --kv-cache-dtype fp8"

amd-Llama-3.3-70B-Instruct-FP8-KV:
  env:
    VLLM_USE_V1: "1"
    VLLM_V1_USE_PREFILL_DECODE_ATTENTION: "1"
    AMDGCN_USE_BUFFER_OPS: "1"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_USE_AITER_TRITON_ROPE: "1"
    TRITON_HIP_ASYNC_COPY_BYPASS_PERMUTE: "1"
    TRITON_HIP_USE_ASYNC_COPY: "1"
    TRITON_HIP_USE_BLOCK_PINGPONG: "1"
    TRITON_HIP_ASYNC_FAST_SWIZZLE: "1"
    # Per-role cudagraph (validated moriio+TP recipe): prefill eager, decode PIECEWISE
    # (the ITL win). Previously an image-level ENV default; now lives with the model.
    PREFILL_CUDAGRAPH_MODE: "NONE"
    DECODE_CUDAGRAPH_MODE: "PIECEWISE"
  prefill:
    tp: "--tensor-parallel-size 8 --max-model-len 65536 --kv-cache-dtype fp8 --disable-custom-all-reduce"
  decode:
    tp: "--tensor-parallel-size 8 --max-model-len 65536 --kv-cache-dtype fp8 --disable-custom-all-reduce"


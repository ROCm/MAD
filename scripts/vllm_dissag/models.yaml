# DeepSeek-V4-Flash-FP8 (MoRI-EP; image from docker/vllm_disagg_gfx942_inference.dsv4.ubuntu.amd.Dockerfile).
DeepSeek-V4-Flash-FP8:
  env:
    VLLM_USE_V1: "1"
    VLLM_USE_V2_MODEL_RUNNER: "0"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_PAGED_ATTN: "0"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_USE_AITER_TRITON_SILU_MUL: "0"
    VLLM_ROCM_USE_AITER_MLA: "1"
    KV_BLOCK_SIZE: "256"
    KV_CACHE_DTYPE: "fp8_e4m3"
    KV_CACHE_MEMORY_BYTES: "20000000000"
    # vLLM snapshots free memory after distributed init, so the MoRI shmem heap
    # and comm buffers already count against it; 0.80 left too little headroom
    # and three prefill ranks failed the startup check.
    GPU_MEMORY_UTILIZATION: "0.70"
    VLLM_CUDAGRAPH_MODE: "NONE"
    PREFILL_CUDAGRAPH_MODE: "NONE"
    # Same decode graph as Pro. vllm#48989 wants FULL_DECODE_ONLY for DSV4
    # (one graph over the fixed-shape decode step). PIECEWISE was the old
    # Flash ITL A/B (~4s/tok); leave that behind for NIAH A/B.
    # Submit-time DECODE_CUDAGRAPH_MODE wins. DSV4_EAGER=1 is the one-shot
    # graph-vs-compress split (decode NONE +quant_fp8, never --enforce-eager).
    DECODE_CUDAGRAPH_MODE: "FULL_DECODE_ONLY"
    CUDAGRAPH_CAPTURE_SIZES: "1 2 4"
    TORCHINDUCTOR_BENCHMARK_KERNEL: "0"
    MORI_SHMEM_HEAP_SIZE: "34359738368"
    # HMA-on: fold-ok 256/256, WRITE page 256, smoke ASCII ~4s/tok.
    # Off = the working path. Do not call skip-swa.
    DSV4_ENABLE_HMA: "0"
    # Decode ITL. vLLM hands the MoE expert stack MoRI's whole preallocated
    # recv buffer -- world_size * max_num_inp_token_per_rank rows, which is
    # mnbt * EP -- so at con=1 one token per rank bought 8192 rows of MXFP4
    # expert GEMM: 79.8% of decode GPU time against 0.6% for MoRI's comm
    # (measured with a shape probe, not inferred). 1 trims that to the
    # rows that can hold a token this forward.
    #
    # Flash EP8 colocated: 308.30 -> 26.80 ms ITL, and the greedy
    # answer is BYTE-IDENTICAL to stock (md5 df15838be8d0), so the padded rows
    # were provably inert. Prefill is untouched by construction -- there the
    # bound equals the buffer and the patcher takes the stock path.
    #
    # Trim is always on and hardcoded in the connector, deliberately NOT here:
    # a value in this file wins over an unset env, which is how a run booted
    # trim=0 while its plan line said the default applied.
    # TYPE 1 already answers Lisa/Paris/London. 36-prompt curl is ~4s/tok.
    CURL_SUITE: "short"
  # HMA and async scheduling off: the MoRIIO DSV4 path is validated HMA=0.
  dp_flags: "--tokenizer-mode deepseek_v4 --disable-hybrid-kv-cache-manager --no-async-scheduling"
  prefill:
    tp: ""
    # default mnbt=16384 took flydsl_fp8_mqa_logits (missing
    # on 5a4c AITER e03) and killed 2k NIAH. 1024 = Pro path.
    # seqs=4 matches Pro (was 16). NIAH is one request; extra seq slots
    # only grow the dummy/workspace.
    dp: "--max-num-seqs 4 --max-model-len 40960 --max-num-batched-tokens 1024"
  decode:
    tp: ""
    dp: "--max-num-seqs 4 --max-model-len 40960 --max-num-batched-tokens 1024"

# DeepSeek-V4-Pro-FP8 (MoRI-EP, same image as Flash). Same
# DeepseekV4ForCausalLM / tokenizer deepseek_v4 / CSA+HCA+SWA hybrid as Flash.
# Do NOT mix scores with Flash, DSV3, or Hy3. Official recipe is
# MI355X colocated TP8; MI300X/MI325X unsupported. 1P/1D OOMed in
# determine_available_memory fused-MoE dummy: 16*40960*7168*bf16 ≈ 9 GiB
# with 125 GiB weights + 32 GiB MoRI heap leaving ~8 GiB free. First retry
# is still 1P/1D smoke: seqs=4, max-model-len 8192 (same first Flash cells),
# KV 4 GiB, heap 16 GiB, decode NONE. Do not mix scores. No NIAH / 2P/2D
# until that dummy fits and smoke is Lisa Su.
# Weights: /shared_inference/models_blog/DeepSeek-V4-Pro-FP8
#   61L, hidden 7168, 128 heads, 384 experts top-6, 805 GiB checkpoint /
#   125 GiB/GPU after EP8. recipe vram_minimum_gb 960. Do not uncap ctx.
#   Do not set KV_BLOCK_SIZE=64 or GLM_SKIP_PATCHERS.
# never loaded. Startup check is free >= util*total. Heap 16 GiB
# + HIP left ~171.5/192 GiB free; util 0.90 wanted 172.79. Same Flash
# 0.80 (needs 153.6) so the check passes; dummy still later.
# util 0.80 loaded 125.16 GiB then dummy profile_run tried 10.50 GiB
# with 748 MiB free. seqs=4 / max-model-len 8192 did not shrink it — cap
# max-num-batched-tokens. TEP TP2×EP8 stays off (back burner).
DeepSeek-V4-Pro-FP8:
  env:
    VLLM_USE_V1: "1"
    VLLM_USE_V2_MODEL_RUNNER: "0"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_PAGED_ATTN: "0"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_USE_AITER_TRITON_SILU_MUL: "0"
    VLLM_ROCM_USE_AITER_MLA: "1"
    KV_BLOCK_SIZE: "256"
    KV_CACHE_DTYPE: "fp8_e4m3"
    KV_CACHE_MEMORY_BYTES: "20000000000"
    # vLLM snapshots free memory after distributed init, so the MoRI shmem heap
    # and comm buffers already count against it; 0.80 left too little headroom
    # and three prefill ranks failed the startup check.
    GPU_MEMORY_UTILIZATION: "0.70"
    VLLM_CUDAGRAPH_MODE: "NONE"
    PREFILL_CUDAGRAPH_MODE: "NONE"
    # Decode was NONE only because the OOM era wanted every byte
    # (that comment's "decode NONE" belongs to the 1P/1D smoke, not to a proven
    # graph hazard). Flash has run PIECEWISE all along, and vllm#48989 validated
    # DSV4-Pro on FULL_DECODE_ONLY, which is the mode DSV4 decode actually wants:
    # one graph over the whole fixed-shape decode step, no piecewise split. This
    # targets the ~0.6-1.0 s/tok steady state, NOT the long-prompt stall (that is
    # KV transfer volume, fixed in the geometry relabel). Prefill stays NONE:
    # capture deadlocks the multi-node DP prefill pod.
    # Submit-time DECODE_CUDAGRAPH_MODE wins. DSV4_EAGER=1 is the one-shot
    # graph-vs-compress split (decode NONE +quant_fp8, never --enforce-eager).
    DECODE_CUDAGRAPH_MODE: "FULL_DECODE_ONLY"
    # Pro decode runs --max-num-seqs 4, so the shared 9-size list would capture
    # 8..256 graphs that no batch can ever reach, paying capture time and pool
    # memory for nothing. Pro is the model that OOMed at util 0.80, so
    # keep the pool to the reachable batch sizes.
    CUDAGRAPH_CAPTURE_SIZES: "1 2 4"
    TORCHINDUCTOR_BENCHMARK_KERNEL: "0"
    MORI_SHMEM_HEAP_SIZE: "17179869184"
    # Dummy passed (mnbt 1024) then HMA-on SimpleGeo garbage.
    # Same HMA-on hole. Off = the Flash path. TEP stays off.
    DSV4_ENABLE_HMA: "0"
    # Trim is on by default from the connector for Pro too -- see the Flash
    # block above. Pro's buffer is the same mnbt * EP shape and Pro has 61
    # layers against Flash's 43, so if anything it pays more for the padding.
    CURL_SUITE: "short"
  # HMA and async scheduling off: the MoRIIO DSV4 path is validated HMA=0.
  dp_flags: "--tokenizer-mode deepseek_v4 --disable-hybrid-kv-cache-manager --no-async-scheduling"
  prefill:
    tp: ""
    # 8k NIAH 400s at 8192. Keep mnbt 1024 (dummy + no flydsl).
    dp: "--max-num-seqs 4 --max-model-len 40960 --max-num-batched-tokens 1024"
  decode:
    tp: ""
    dp: "--max-num-seqs 4 --max-model-len 40960 --max-num-batched-tokens 1024"

# ============================ MoE + DSA (wideEP only) ============================

# GLM-5.1-FP8 (zai-org/GLM-5.1-FP8, arch GlmMoeDsaForCausalLM): MLA + DeepSeek
# Sparse Attention (DSA). 78 layers (3 dense + 75 MoE), 256 routed experts top-8
# + 1 shared, FP8 block 128. wideEP-only (see WIDE_EP_ONLY_MODELS in the slurm).
#
# IMAGE CONTRACT: config only, NO vLLM source fixes. The DSA enablement (upstream
# #47766, DSA indexer KV transfer over MoRIIO) must be IN-SOURCE in the image's vLLM.
# Build the vllm-glm51 image (compat/images/vllm-glm51.yaml), whose vLLM build and
# patch ARE the contract. DOCKER_IMAGE_NAME is submit-time, not set here.
#
# NOT SUPPORTED: images predating the in-source DSA fixes boot and serve but return
# silently wrong output (rocm/pytorch-private:glm-dockerimage-built-09072026 scored NIAH
# 2k 0/10). There is no runtime patcher and no fallback — rebuild at the pinned VLLM_REF.
#
# GLM vs DeepSeek (both MLA MoE; GLM is DSA-sparse):
#   - KV_BLOCK_SIZE=1            DSA sparse indexer REQUIRES block-size 1 (DS uses 16)
#   - VLLM_ROCM_USE_AITER_MLA=1  AITER sparse MLA path ON (DS sets 0)
#   - prefill cudagraph NONE     capture deadlocks on this stack; decode captures fine
# block=1 and AITER_MLA=1 are already the moriio.sh defaults; set explicitly so the
# recipe survives a connector default change.
#
# dp_flags carry the GLM tool/reasoning parsers and apply to both roles; the dp: blocks
# stay empty like the DeepSeek family because the recipe comes from env:.
#
# Long-context: the earlier ~18k collapse is fixed in-source (#47766 persistent sparse-MLA
# metadata), not by config. Left at native max_model_len; capping was tested, no benefit.
GLM-5.1-FP8:
  roles:                                # what every role needs (scripts/common/recipe/recipe.py)
    default: {quantization: {weights: fp8, activations: fp8}, kv_cache: fp8}
    prefill: {}
    decode: {}
  env:
    VLLM_USE_V1: "1"
    # v0.27 wraps layer_name in a torch OpaqueBase for the unified MLA custom ops, and
    # the boxing FAILS on this ROCm torch build -> "RuntimeError: unknown parameter type"
    # on the first real MLA decode (the compile path returns early, so it passes
    # boot+warmup then crashes on the first request). 0 restores the plain-string path.
    VLLM_USE_LAYERNAME: "0"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_ROCM_USE_AITER_MLA: "1"
    KV_BLOCK_SIZE: "1"
    KV_CACHE_DTYPE: "fp8"
    VLLM_CUDAGRAPH_MODE: "NONE"
    PREFILL_CUDAGRAPH_MODE: "NONE"
    # FULL graph for the uniform-decode shapes, PIECEWISE for everything else. Chosen
    # over plain PIECEWISE because it measured faster for decode on MI300X; the gain
    # narrows as EP widens, since the cross-node all2all inside the captured step does
    # not compress. Costs a longer boot (capture is slower and the captured graphs hold
    # more memory than PIECEWISE) - notable for CI. Set PIECEWISE to fall back.
    DECODE_CUDAGRAPH_MODE: "FULL_AND_PIECEWISE"
    CUDAGRAPH_CAPTURE_SIZES: "1 2 4 8 16 32 64 128 256"
    # Moves graph partitioning to inductor codegen (MLA KV-update becomes an eager
    # boundary). The connector default is OFF, so GLM opts in here and no other model's
    # --compilation-config changes. Not a correctness requirement - an A/B was accuracy-
    # neutral and within noise on latency - but kept ON because it is the configuration
    # this recipe was exercised with.
    USE_INDUCTOR_GRAPH_PARTITION: "1"
    VLLM_ALL2ALL_BACKEND: "mori_high_throughput"
    PREFILL_MORI_BACKEND: "mori_high_throughput"
    DECODE_MORI_BACKEND: "mori_low_latency"
    # MoRI EP shared-memory heap (16 GiB). The dispatch/combine width itself is set by
    # decode.dp below, not by this.
    MORI_SHMEM_HEAP_SIZE: "17179869184"
    # DSA sparse-indexer logits-buffer cap (crash fix). The indexer only sub-chunks the
    # query dim when M*N*4 exceeds this budget; the 512MB default lets an 8192-token
    # prefill launch fp8_mqa_logits at grid=(8192,), which HARD-FAULTS the worker on
    # gfx942 (silent GPU fault -> DP group collapse -> 503 at >=8k prompts). 64MB forces
    # M-dim sub-chunking (~2k tokens/chunk) so the buffer and launch stay bounded.
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "64"
    # NCCL heartbeat watchdog: at long context (>~8k) a DP rank's sparse-MLA/MoE all2all
    # can exceed the default HeartbeatMonitor timeout, so the monitor declares the rank
    # dead and tears down the whole process group -> prefill EngineCore crash -> 503.
    # Disable the monitor-triggered teardown and extend the timeouts.
    TORCH_NCCL_ENABLE_MONITORING: "0"
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "1800"
    TORCH_NCCL_DUMP_ON_TIMEOUT: "0"
    TORCH_NCCL_BLOCKING_WAIT: "0"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_IB_TIMEOUT: "22"
    # Per-shape warmup before each measured isl/osl cell, which the sweep's global 32/32
    # con=1 warmup does not cover. Kept because the latency figures above were measured
    # with it on, not because it was shown to help: an A/B at 1024/1024 con=8 was neutral.
    # The script default is OFF, so no other model's sweep changes.
    SHAPE_WARMUP: "1"
  dp_flags: "--tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice --chat-template-content-format string"
  prefill:
    dp: ""
  decode:
    # PERF: the MoRI EP dispatch width comes from max_num_batched_tokens, so the decode
    # role otherwise runs an 8192-token-wide all2all every step, which dominates decode
    # latency. It cannot be shrunk via env: mori derives recv capacity from the send
    # width, so the buffer must still cover vLLM's profiling dummy run. Keep >= typical
    # prompt length: smaller values cut per-token latency but inflate TTFT sharply;
    # 2048 was the balance point.
    dp: "--max-num-batched-tokens 2048"
# ============================ Kimi-K3 (MXFP4) on MI300X / gfx942 ============================
# wideEP-only, and the first entry that needs TP>1 on the wideEP path.
#
# WHY TP2. K3 is ~2.8T params / 896 experts with a hybrid MLA + Kimi-Delta-Attention
# stack. On MI300X (192 GB/GPU) the REPLICATED (attn + shared-expert) weight is
# 106.5 GiB. At TP1/DP16 that lands 190.7 GiB/GPU before KV cache or the MoRI heap
# -> does not fit. TP2 shards it to 53.3 GiB/GPU; with 84.2 GiB of expert shard that
# is 137.5 GiB + 16 GiB MoRI heap, leaving room for KV. So the pool is TP2 x DP8 =
# EP16 over 16 GPUs (2 nodes), i.e. xP=2 yD=2 EP_TP_SIZE=2.
#
# gfx942 specifics:
#   - VLLM_ROCM_USE_AITER_MLA=0 is REQUIRED: the AITER MLA kernel is gfx950-only.
#   - gfx942 has no scaled-MXFP4 MFMA and the a16w4 SiTUv2 heuristic FlyDSL kernel
#     cannot codegen there, so the MoE is requantized to packed-int4 and run through
#     SiTUv2 (AITER_SITUV2_A8W4=1 + the --quantization-config below).
#   - MAX_NUM_BATCHED_TOKENS stays at 2048: 8192 corrupts generation on this stack,
#     and the giant profiling shape at 16384 crashes LLVM codegen in the heuristic
#     FlyDSL kernel.
#   - KV_CACHE_MEMORY_BYTES=40e9 gives a 2.84M-token GPU KV cache, required for
#     single requests beyond ~600K tokens. It also skips the boot profiling forward.
_kimi_k3_recipe_env: &kimi_k3_recipe_env
  EP_TP_SIZE: "2"                       # TP2 x DP8 per pool (see WHY TP2 above)
  GPU_ARCHS: "gfx942"                   # int4 requant + MLA-off are gfx942 workarounds
  VLLM_USE_V1: "1"
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_MOE: "1"
  VLLM_ROCM_USE_AITER_MLA: "0"          # REQUIRED on gfx942 (AITER MLA is gfx950-only)
  VLLM_ROCM_USE_AITER_RMSNORM: "1"
  VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "0"
  VLLM_USE_AITER_TRITON_SILU_MUL: "0"
  AITER_SITUV2_A8W4: "1"                # a8w4 (fp8-act x int4-wt) SiTU MoE path
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"      # KDA (Kimi-Delta-Attention) conv state layout
  KV_BLOCK_SIZE: "16"
  KV_CACHE_DTYPE: "fp8"
  KV_CACHE_MEMORY_BYTES: "40000000000"  # 2.84M-token KV cache; needed for >600K ctx
  GPU_MEMORY_UTILIZATION: "0.88"        # 0.88 leaves the 16 GiB MoRI shmem heap
  PREFILL_CUDAGRAPH_MODE: "NONE"
  DECODE_CUDAGRAPH_MODE: "PIECEWISE"
  VLLM_ALL2ALL_BACKEND: "mori_high_throughput"
  PREFILL_MORI_BACKEND: "mori_high_throughput"
  DECODE_MORI_BACKEND: "mori_low_latency"
  MORI_SHMEM_HEAP_SIZE: "17179869184"
  MORI_NUM_QP_PER_PE: "8"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  DISTRIBUTED_TIMEOUT_SECONDS: "7200"

# Serve flags the connector does not already emit. --max-model-len 1000000 is K3's
# full native context; drop it to 10240 for a quick smoke run.
#
# NOTE: these strings are split with shell-style quoting (shlex, in
# _model_config_to_array), so any value containing JSON must carry its OWN
# quotes - otherwise quote-removal strips the JSON's double quotes and vLLM gets
# invalid JSON.
_kimi_k3_dp_flags: &kimi_k3_dp_flags >-
  --reasoning-parser kimi_k3
  --mm-encoder-tp-mode data
  --safetensors-load-strategy prefetch
  --max-model-len 1000000
  --max-num-seqs 8
  --max-num-batched-tokens 2048
  --quantization-config '{"moe":{"weight":"int4_per_group_32"}}'

# Kimi-K3-MXFP4 (MI300X gfx942 wideEP disagg). Recipe knobs proven by the PR#241
# standalone Kimi-K3 launcher (out of tree); vLLM connector fixes live in the
# disagg image (the PR#241-proven v4 build; the recipe's vLLM/MoRIIO connector fixes are folded into that image's vLLM source).
_kimik3_recipe_env: &kimik3_recipe_env
  # TP size within each EP pool (TP2xDP8 -> EP16). Unset/1 = plain wideEP.
  EP_TP_SIZE: "2"
  # MI300X-only: the MoE is requantized to int4 because gfx942 has no scaled-MXFP4
  # MFMA, and the image is built for gfx942. Native MXFP4 on MI355X is its own recipe.
  GPU_ARCHS: "gfx942"
  VLLM_USE_V1: "1"
  NCCL_DEBUG: "WARN"
  NCCL_DEBUG_SUBSYS: "INIT,NET"
  # No fabric settings here (rail list, GID index, socket interface): they are facts
  # about the cluster, not the model. scripts/common/cluster.sh derives them from the
  # adapters present, connectors/moriio.env and moriio.sh fill the rest, and any of
  # them can be exported at submit time. A model recipe that pins them wins over all
  # of that and silently breaks on a different fabric.
  NCCL_IB_DISABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_MLA: "0"
  VLLM_ROCM_USE_AITER_MOE: "1"
  VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "0"
  VLLM_USE_AITER_TRITON_SILU_MUL: "0"
  VLLM_ROCM_USE_AITER_RMSNORM: "1"
  AITER_SITUV2_A8W4: "1"
  VLLM_ROCM_USE_AITER_MOE_SITUV2_A8W4: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "64"
  K3_MLA_SINGLE_SPLIT: "1"
  K3_MLA_FULL_PREFILL: "1"
  K3_GROUP_ROUTING: "1"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  KV_BLOCK_SIZE: "16"
  KV_CACHE_DTYPE: "fp8"
  KV_CACHE_MEMORY_BYTES: "8000000000"
  # 0.68 is the PR#241 (435641)-validated value on the con1fix v4 image; confirmed via /proc on
  # the live 435862 run (12/12 NIAH 50K-280K). Higher util starves decode warmup activation.
  GPU_MEMORY_UTILIZATION: "0.68"
  MAX_NUM_BATCHED_TOKENS: "2048"
  MAX_MODEL_LEN: "320000"
  PREFILL_CUDAGRAPH_MODE: "NONE"
  # Decode: FULL_AND_PIECEWISE -- the PR#241 (435641)-validated launch captures decode cudagraphs
  # on the con1fix v4 image (perf/number parity). Prefill stays NONE. Confirmed via /proc on 435862.
  DECODE_CUDAGRAPH_MODE: "FULL_AND_PIECEWISE"
  VLLM_ALL2ALL_BACKEND: "mori_low_latency"
  PREFILL_MORI_BACKEND: "mori_high_throughput"
  DECODE_MORI_BACKEND: "mori_low_latency"
  MORI_SHMEM_HEAP_SIZE: "8589934592"
  # Deterministic RDMA read-after-write barrier: forces written KV globally visible in
  # the receiver's HBM before write_done (moriio_engine.py). Fixes the P->D write-race
  # seen as "unmap MISS table_size=0" / "missing remote notify address" on repeat requests
  # (KV blocks then leak on prefill -> stall). Lives in connectors/moriio.env, which the
  # interactive drive_cell.sh path does NOT source, so it must be in the recipe env to
  # propagate. Verified unset in the EngineCore process env on the failing run.
  # NOTE: readback RE-ENABLED on the v4 image. The v3-era libmori BatchRead binding bug
  # (scalar-arg read_remote_data() threw "k3-readback failed ... continuing" every request,
  # so the read-after-write fence never ran) is fixed in the v4 image; the deterministic RDMA
  # read-after-write barrier now works and is the PR#241-proven path. The sleep fence
  # (K3_WRITE_FENCE) + device sync (K3_WRITE_DEVSYNC) are therefore OFF (readback supersedes them).
  K3_WRITE_READBACK: "1"
  K3_WRITE_READBACK_BYTES: "8"
  K3_WRITE_FENCE: "0"
  K3_WRITE_DEVSYNC: "0"
  # --- PR241 parity additions ---
  # These vars previously lived only in connectors/moriio.env or moriio.sh defaults and did
  # not reach the container on the interactive drive_cell.sh path (moriio.env is only sourced
  # by run_xPyD_models.slurm). Set here so the interactive path matches PR241's validated env.
  # NCCL reliability + watchdog (PR241 docker -e block):
  NCCL_IB_TIMEOUT: "22"
  TORCH_NCCL_ENABLE_MONITORING: "0"
  TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "1800"
  TORCH_NCCL_DUMP_ON_TIMEOUT: "0"
  TORCH_NCCL_BLOCKING_WAIT: "0"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  # AITER MHA (PR241 sets =1 explicitly; moriio.sh does not set it):
  VLLM_ROCM_USE_AITER_MHA: "1"
  # MoRI RDMA knobs (moriio.env-only -> did not propagate interactively):
  MORI_IB_ENABLE_RELAXED_ORDERING: "1"
  MORI_IO_SL: "1"
  # MoRI QP count: moriio.sh default (4) is below PR241; pin to PR241 value:
  MORI_NUM_QP_PER_PE: "8"
  # K3 gate knob:
  K3_CHUNK_GATE_SLACK: "2"
  # Sleep-fence duration; INERT now that K3_WRITE_FENCE=0 (readback is the active path on v4). Kept for reference.
  K3_WRITE_FENCE_MS: "20"

# ============================ Kimi-K3 native MXFP4 on MI355X / gfx950 ============================
# BRING-UP RECIPE, NOT VALIDATED. MoRIIO disagg with Kimi-K3 has only run on MI300X; see
# docs/kimi-k3.md (Kimi-K3-MXFP4-MI355X bring-up) for what a first gfx950 run may hit.
# The launcher refuses it on any GPU but gfx950 (GPU_ARCHS), as the MI300X recipes refuse gfx950.
#
# What changes from the MI300X recipes, and why:
#   - No --quantization-config: gfx950 has scaled-MXFP4 MFMA, and the vLLM fork picks the
#     native path itself there. The int4 requant is a gfx942 workaround.
#   - AITER MLA on (moriio.sh default): it is gfx950-only, which is why MI300X turns it off.
#   - EP_TP_SIZE=1: MI355X has 288 GB. TP1/DP16 per GPU is 106.5 GiB replicated + 84.2 GiB
#     expert shard + 16 GiB MoRI heap = 206.7 GiB, ~81 GiB left for KV and activations - about
#     twice the MI300X TP2 headroom. MLA's latent KV is replicated across TP anyway, so TP1
#     costs no KV per token. TP1/DP16 is also the reference MoRIIO topology and what upstream's
#     MI355X prefill/decode recipe uses. EP_TP_SIZE=2 remains a one-knob fallback.
#   - --max-num-batched-tokens 4096 (the single-node MI355X card's value): the MI300X 2048 cap
#     works around gfx942 codegen and corruption bugs.
# Everything else is the MI300X Kimi-K3 recipe, marked where the single-node MI355X card
# (scripts/vllm/configs/default.yaml) is the source instead.
_kimi_k3_mi355x_recipe_env: &kimi_k3_mi355x_recipe_env
  EP_TP_SIZE: "1"
  GPU_ARCHS: "gfx950"
  VLLM_USE_V1: "1"
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_MOE: "1"
  VLLM_ROCM_USE_AITER_MLA: "1"
  VLLM_ROCM_USE_AITER_RMSNORM: "1"
  VLLM_ROCM_USE_AITER_FUSION_SHARED_EXPERTS: "0"
  VLLM_USE_AITER_TRITON_SILU_MUL: "0"
  AITER_SITUV2_A8W4: "1"                # a8w4 MoE on the native MXFP4 weights (single-node card)
  AITER_BF16_FP8_MOE_BOUND: "0"         # single-node card
  SAFETENSORS_FAST_GPU: "1"             # single-node card
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"     # single-node card
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"      # KDA conv state layout
  KV_BLOCK_SIZE: "16"
  KV_CACHE_DTYPE: "fp8"
  KV_CACHE_MEMORY_BYTES: "40000000000"
  GPU_MEMORY_UTILIZATION: "0.88"        # budget above: needs >= ~0.82, leaves the 16 GiB heap
  PREFILL_CUDAGRAPH_MODE: "NONE"
  DECODE_CUDAGRAPH_MODE: "PIECEWISE"
  VLLM_ALL2ALL_BACKEND: "mori_high_throughput"
  PREFILL_MORI_BACKEND: "mori_high_throughput"
  DECODE_MORI_BACKEND: "mori_low_latency"
  MORI_SHMEM_HEAP_SIZE: "17179869184"
  MORI_NUM_QP_PER_PE: "8"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  DISTRIBUTED_TIMEOUT_SECONDS: "7200"

_kimi_k3_mi355x_dp_flags: &kimi_k3_mi355x_dp_flags >-
  --reasoning-parser kimi_k3
  --mm-encoder-tp-mode data
  --safetensors-load-strategy prefetch
  --max-model-len 320000
  --max-num-seqs 8
  --max-num-batched-tokens 4096

Kimi-K3:                                # one recipe: the gfx942 variant above is the default
  default_arch: gfx942
  roles:                                # MXFP4 weights, fp8 activations and KV; gfx942 converts to int4
    default:
      quantization: {weights: mxfp4, activations: fp8}
      kv_cache: fp8
    prefill: {}
    decode: {}
  variants:
    gfx942:
      env: *kimi_k3_recipe_env
      prefill:
        dp: *kimi_k3_dp_flags
      decode:
        dp: *kimi_k3_dp_flags
    gfx950:                             # MXFP4 is native: the MI355X recipe (see Kimi-K3-MXFP4)
      env: *kimi_k3_mi355x_recipe_env
      prefill:
        dp: *kimi_k3_mi355x_dp_flags
      decode:
        dp: *kimi_k3_mi355x_dp_flags

# Kimi-K3-MXFP4: one recipe, a variant per accelerator (scripts/common/recipe/models.py). The
# MI300X recipe above is its gfx942 variant and the default; the gfx950 variant is the MI355X
# bring-up recipe, which a card names as Kimi-K3-MXFP4-MI355X. Placed after both sets of
# anchors, which YAML needs defined first.
Kimi-K3-MXFP4:
  default_arch: gfx942
  roles:                                # MXFP4 weights, fp8 activations and KV on every GPU; gfx942
    default:                            # converts the weights to int4 (its flags say so)
      quantization: {weights: mxfp4, activations: fp8}
      kv_cache: fp8
    prefill: {}
    decode: {}
  variants:
    gfx942:
      env: *kimik3_recipe_env
      prefill:
        dp: '--served-model-name kimi-k3 --reasoning-parser kimi_k3 --mm-encoder-tp-mode data --safetensors-load-strategy prefetch --max-model-len 320000 --max-num-seqs 8 --quantization-config ''{"moe":{"weight":"int4_per_group_32"}}'''
      decode:
        dp: '--served-model-name kimi-k3 --reasoning-parser kimi_k3 --mm-encoder-tp-mode data --safetensors-load-strategy prefetch --max-model-len 320000 --max-num-seqs 8 --quantization-config ''{"moe":{"weight":"int4_per_group_32"}}'''
    gfx950:
      env: *kimi_k3_mi355x_recipe_env
      prefill:
        dp: *kimi_k3_mi355x_dp_flags
      decode:
        dp: *kimi_k3_mi355x_dp_flags

Kimi-K3-MXFP4-MI355X:                   # the gfx950 variant, by name for its card
  alias: Kimi-K3-MXFP4
  arch: gfx950

# ============================ End-to-end examples (docs/context_as_code_developer_guide.md) ============================
# Each inherits a validated recipe (alias) and changes only what the example demonstrates; the
# base recipes above are untouched.

# DeepSeek-V3 with multi-token-prediction speculative decoding on the decode role, and its KV
# budget written as a fraction of GPU memory instead of 20 GB for one GPU (null drops the byte count).
DeepSeek-V3-MTP:
  alias: DeepSeek-V3
  env: {KV_CACHE_MEMORY_BYTES: null}
  memory: {KV_CACHE_MEMORY_BYTES: {fraction: 0.1}}
  roles:
    decode: {speculative: {method: deepseek_mtp, num_speculative_tokens: 1}}

# Demo. The two checkpoint names below are placeholders for checkpoints you provide.
# Disaggregated quantization: compute-bound prefill in FP4 W4A4 from its own
# checkpoint, memory-bound decode weight-only 4-bit with 16-bit activations from another. Needs FP4
# matrix compute: resolves on gfx950, refused on gfx942 naming the FP4 activations.
DeepSeek-V3-DQ:
  alias: DeepSeek-V3
  roles:
    prefill: {artifact: DeepSeek-V3-MXFP4-W4A4, quantization: {weights: mxfp4, activations: mxfp4}}
    decode: {artifact: DeepSeek-V3-MXFP4-W4A16, quantization: {weights: mxfp4, activations: bf16}}

# Qwen3-32B serving LoRA adapters beside the base model.
Qwen3-32B-LoRA:
  alias: Qwen3-32B
  roles:
    default:
      lora: {modules: {sql: /adapters/qwen3-32b-sql, support: /adapters/qwen3-32b-support}, max_loras: 4, max_rank: 64}

# An embedding model: a pooling server (its flags come from the workload), BF16, any GPU.
Qwen3-Embedding-8B:
  roles:
    default: {quantization: {weights: bf16, activations: bf16}}
    server: {}

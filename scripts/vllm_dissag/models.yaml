# ============================ MoE (TP + wideEP) ============================

# DeepSeek-V3 family. The env: block encodes the validated MoRI-EP recipe knobs
# (from MAD-private #324 DeepSeekV3_recipe.env). They are exported BEFORE the
# connector's setup_env, so they define the wideEP recipe by default while still
# yielding to a submit-time `-e` override. WIDE_EP=1 (wideEP) reads these; the
# connector emits --block-size/--kv-cache-memory-bytes/--all2all-backend from them.
# The tp: blocks are the TP-mode (WIDE_EP=0) flags (dense-style serving).
#   - block=16 + AITER_MLA=0: block=1 + AITER-MLA fp8 decode kernel GPU-faults.
#   - KV_CACHE_MEMORY_BYTES: skip the boot profiling forward (AITER eager fp8 quant
#     aiter_tensor_t bug). PREFILL cudagraph NONE (capture deadlocks 16-way DP),
#     DECODE PIECEWISE (ITL win). Per-role mori backends: prefill HT, decode LL.
#   - MoRIIO disagg fixes (#39276 etc.) are committed in-source in the image's vLLM
#     (Dockerfile VLLM_REF), so there is no runtime patcher to gate.
_deepseek_recipe_env: &deepseek_recipe_env
  VLLM_USE_V1: "1"
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_PAGED_ATTN: "0"
  VLLM_ROCM_USE_AITER_RMSNORM: "1"
  VLLM_USE_AITER_TRITON_SILU_MUL: "0"
  VLLM_ROCM_USE_AITER_MLA: "0"
  KV_BLOCK_SIZE: "16"
  KV_CACHE_DTYPE: "fp8"
  KV_CACHE_MEMORY_BYTES: "20000000000"
  VLLM_CUDAGRAPH_MODE: "PIECEWISE"
  PREFILL_CUDAGRAPH_MODE: "NONE"
  DECODE_CUDAGRAPH_MODE: "PIECEWISE"
  CUDAGRAPH_CAPTURE_SIZES: "1 2 4 8 16 32 64 128 256"
  TORCHINDUCTOR_BENCHMARK_KERNEL: "0"
  VLLM_ALL2ALL_BACKEND: "mori_high_throughput"
  PREFILL_MORI_BACKEND: "mori_high_throughput"
  DECODE_MORI_BACKEND: "mori_low_latency"
  MORI_SHMEM_HEAP_SIZE: "17179869184"

# DeepSeek family is wideEP-only (gated in run_xPyD_models.slurm: TP mode is rejected).
# The dp: blocks are empty because the moriio(mori) connector emits the validated
# wideEP serve flags (block-size, kv-cache-*, all2all, cudagraph) from the env: recipe
# above. No tp: blocks — TP is unsupported for these models.
DeepSeek-V3:
  env: *deepseek_recipe_env
  prefill:
    dp: ""
  decode:
    dp: ""

DeepSeek-V3-5layer:
  env: *deepseek_recipe_env
  prefill:
    dp: ""
  decode:
    dp: ""

DeepSeek-R1:
  env: *deepseek_recipe_env
  prefill:
    dp: ""
  decode:
    dp: ""

# DeepSeek-V4-Flash-FP8 (MoRI-EP; image from docker/vllm_disagg_inference.dsv4.ubuntu.amd.Dockerfile).
DeepSeek-V4-Flash-FP8:
  env:
    VLLM_USE_V1: "1"
    VLLM_USE_V2_MODEL_RUNNER: "0"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_PAGED_ATTN: "0"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_USE_AITER_TRITON_SILU_MUL: "0"
    VLLM_ROCM_USE_AITER_MLA: "1"
    KV_BLOCK_SIZE: "256"
    KV_CACHE_DTYPE: "fp8_e4m3"
    KV_CACHE_MEMORY_BYTES: "20000000000"
    # vLLM snapshots free memory after distributed init, so the MoRI shmem heap
    # and comm buffers already count against it; 0.80 left too little headroom
    # and three prefill ranks failed the startup check.
    GPU_MEMORY_UTILIZATION: "0.70"
    VLLM_CUDAGRAPH_MODE: "NONE"
    PREFILL_CUDAGRAPH_MODE: "NONE"
    # Same decode graph as Pro. vllm#48989 wants FULL_DECODE_ONLY for DSV4
    # (one graph over the fixed-shape decode step). PIECEWISE was the old
    # Flash ITL A/B (~4s/tok); leave that behind for NIAH A/B.
    # Submit-time DECODE_CUDAGRAPH_MODE wins. DSV4_EAGER=1 is the one-shot
    # graph-vs-compress split (decode NONE +quant_fp8, never --enforce-eager).
    DECODE_CUDAGRAPH_MODE: "FULL_DECODE_ONLY"
    CUDAGRAPH_CAPTURE_SIZES: "1 2 4"
    TORCHINDUCTOR_BENCHMARK_KERNEL: "0"
    MORI_SHMEM_HEAP_SIZE: "34359738368"
    # HMA-on: fold-ok 256/256, WRITE page 256, smoke ASCII ~4s/tok.
    # Off = the working path. Do not call skip-swa.
    DSV4_ENABLE_HMA: "0"
    # Decode ITL. vLLM hands the MoE expert stack MoRI's whole preallocated
    # recv buffer -- world_size * max_num_inp_token_per_rank rows, which is
    # mnbt * EP -- so at con=1 one token per rank bought 8192 rows of MXFP4
    # expert GEMM: 79.8% of decode GPU time against 0.6% for MoRI's comm
    # (measured with a shape probe, not inferred). 1 trims that to the
    # rows that can hold a token this forward.
    #
    # Flash EP8 colocated: 308.30 -> 26.80 ms ITL, and the greedy
    # answer is BYTE-IDENTICAL to stock (md5 df15838be8d0), so the padded rows
    # were provably inert. Prefill is untouched by construction -- there the
    # bound equals the buffer and the patcher takes the stock path.
    #
    # Trim is always on and hardcoded in the connector, deliberately NOT here:
    # a value in this file wins over an unset env, which is how a run booted
    # trim=0 while its plan line said the default applied.
    # TYPE 1 already answers Lisa/Paris/London. 36-prompt curl is ~4s/tok.
    CURL_SUITE: "short"
  # HMA and async scheduling off: the MoRIIO DSV4 path is validated HMA=0.
  dp_flags: "--tokenizer-mode deepseek_v4 --disable-hybrid-kv-cache-manager --no-async-scheduling"
  prefill:
    tp: ""
    # default mnbt=16384 took flydsl_fp8_mqa_logits (missing
    # on 5a4c AITER e03) and killed 2k NIAH. 1024 = Pro path.
    # seqs=4 matches Pro (was 16). NIAH is one request; extra seq slots
    # only grow the dummy/workspace.
    dp: "--max-num-seqs 4 --max-model-len 40960 --max-num-batched-tokens 1024"
  decode:
    tp: ""
    dp: "--max-num-seqs 4 --max-model-len 40960 --max-num-batched-tokens 1024"

# DeepSeek-V4-Pro-FP8 (MoRI-EP, same image as Flash). Same
# DeepseekV4ForCausalLM / tokenizer deepseek_v4 / CSA+HCA+SWA hybrid as Flash.
# Do NOT mix scores with Flash, DSV3, or Hy3. Official recipe is
# MI355X colocated TP8; MI300X/MI325X unsupported. 1P/1D OOMed in
# determine_available_memory fused-MoE dummy: 16*40960*7168*bf16 ≈ 9 GiB
# with 125 GiB weights + 32 GiB MoRI heap leaving ~8 GiB free. First retry
# is still 1P/1D smoke: seqs=4, max-model-len 8192 (same first Flash cells),
# KV 4 GiB, heap 16 GiB, decode NONE. Do not mix scores. No NIAH / 2P/2D
# until that dummy fits and smoke is Lisa Su.
# Weights: /shared_inference/models_blog/DeepSeek-V4-Pro-FP8
#   61L, hidden 7168, 128 heads, 384 experts top-6, 805 GiB checkpoint /
#   125 GiB/GPU after EP8. recipe vram_minimum_gb 960. Do not uncap ctx.
#   Do not set KV_BLOCK_SIZE=64 or GLM_SKIP_PATCHERS.
# never loaded. Startup check is free >= util*total. Heap 16 GiB
# + HIP left ~171.5/192 GiB free; util 0.90 wanted 172.79. Same Flash
# 0.80 (needs 153.6) so the check passes; dummy still later.
# util 0.80 loaded 125.16 GiB then dummy profile_run tried 10.50 GiB
# with 748 MiB free. seqs=4 / max-model-len 8192 did not shrink it — cap
# max-num-batched-tokens. TEP TP2×EP8 stays off (back burner).
DeepSeek-V4-Pro-FP8:
  env:
    VLLM_USE_V1: "1"
    VLLM_USE_V2_MODEL_RUNNER: "0"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_PAGED_ATTN: "0"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_USE_AITER_TRITON_SILU_MUL: "0"
    VLLM_ROCM_USE_AITER_MLA: "1"
    KV_BLOCK_SIZE: "256"
    KV_CACHE_DTYPE: "fp8_e4m3"
    KV_CACHE_MEMORY_BYTES: "20000000000"
    # vLLM snapshots free memory after distributed init, so the MoRI shmem heap
    # and comm buffers already count against it; 0.80 left too little headroom
    # and three prefill ranks failed the startup check.
    GPU_MEMORY_UTILIZATION: "0.70"
    VLLM_CUDAGRAPH_MODE: "NONE"
    PREFILL_CUDAGRAPH_MODE: "NONE"
    # Decode was NONE only because the OOM era wanted every byte
    # (that comment's "decode NONE" belongs to the 1P/1D smoke, not to a proven
    # graph hazard). Flash has run PIECEWISE all along, and vllm#48989 validated
    # DSV4-Pro on FULL_DECODE_ONLY, which is the mode DSV4 decode actually wants:
    # one graph over the whole fixed-shape decode step, no piecewise split. This
    # targets the ~0.6-1.0 s/tok steady state, NOT the long-prompt stall (that is
    # KV transfer volume, fixed in the geometry relabel). Prefill stays NONE:
    # capture deadlocks the multi-node DP prefill pod.
    # Submit-time DECODE_CUDAGRAPH_MODE wins. DSV4_EAGER=1 is the one-shot
    # graph-vs-compress split (decode NONE +quant_fp8, never --enforce-eager).
    DECODE_CUDAGRAPH_MODE: "FULL_DECODE_ONLY"
    # Pro decode runs --max-num-seqs 4, so the shared 9-size list would capture
    # 8..256 graphs that no batch can ever reach, paying capture time and pool
    # memory for nothing. Pro is the model that OOMed at util 0.80, so
    # keep the pool to the reachable batch sizes.
    CUDAGRAPH_CAPTURE_SIZES: "1 2 4"
    TORCHINDUCTOR_BENCHMARK_KERNEL: "0"
    MORI_SHMEM_HEAP_SIZE: "17179869184"
    # Dummy passed (mnbt 1024) then HMA-on SimpleGeo garbage.
    # Same HMA-on hole. Off = the Flash path. TEP stays off.
    DSV4_ENABLE_HMA: "0"
    # Trim is on by default from the connector for Pro too -- see the Flash
    # block above. Pro's buffer is the same mnbt * EP shape and Pro has 61
    # layers against Flash's 43, so if anything it pays more for the padding.
    CURL_SUITE: "short"
  # HMA and async scheduling off: the MoRIIO DSV4 path is validated HMA=0.
  dp_flags: "--tokenizer-mode deepseek_v4 --disable-hybrid-kv-cache-manager --no-async-scheduling"
  prefill:
    tp: ""
    # 8k NIAH 400s at 8192. Keep mnbt 1024 (dummy + no flydsl).
    dp: "--max-num-seqs 4 --max-model-len 40960 --max-num-batched-tokens 1024"
  decode:
    tp: ""
    dp: "--max-num-seqs 4 --max-model-len 40960 --max-num-batched-tokens 1024"

# ============================ MoE + DSA (wideEP only) ============================

# GLM-5.1-FP8 (zai-org/GLM-5.1-FP8, arch GlmMoeDsaForCausalLM): MLA + DeepSeek
# Sparse Attention (DSA). 78 layers (3 dense + 75 MoE), 256 routed experts top-8
# + 1 shared, FP8 block 128. wideEP-only (see WIDE_EP_ONLY_MODELS in the slurm).
#
# IMAGE CONTRACT: config only, NO vLLM source fixes. The DSA enablement (upstream
# #47766, DSA indexer KV transfer over MoRIIO) must be IN-SOURCE in the image's vLLM.
# Build from docker/vllm_disagg_inference.glmv5.1.ubuntu.amd.Dockerfile, whose VLLM_REF
# pin IS the contract. DOCKER_IMAGE_NAME is submit-time, not set here.
#
# NOT SUPPORTED: images predating the in-source DSA fixes boot and serve but return
# silently wrong output (rocm/pytorch-private:glm-dockerimage-built-09072026 scored NIAH
# 2k 0/10). There is no runtime patcher and no fallback — rebuild at the pinned VLLM_REF.
#
# GLM vs DeepSeek (both MLA MoE; GLM is DSA-sparse):
#   - KV_BLOCK_SIZE=1            DSA sparse indexer REQUIRES block-size 1 (DS uses 16)
#   - VLLM_ROCM_USE_AITER_MLA=1  AITER sparse MLA path ON (DS sets 0)
#   - prefill cudagraph NONE     capture deadlocks on this stack; decode captures fine
# block=1 and AITER_MLA=1 are already the moriio.sh defaults; set explicitly so the
# recipe survives a connector default change.
#
# dp_flags carry the GLM tool/reasoning parsers and apply to both roles; the dp: blocks
# stay empty like the DeepSeek family because the recipe comes from env:.
#
# Long-context: the earlier ~18k collapse is fixed in-source (#47766 persistent sparse-MLA
# metadata), not by config. Left at native max_model_len; capping was tested, no benefit.
GLM-5.1-FP8:
  env:
    VLLM_USE_V1: "1"
    # v0.27 wraps layer_name in a torch OpaqueBase for the unified MLA custom ops, and
    # the boxing FAILS on this ROCm torch build -> "RuntimeError: unknown parameter type"
    # on the first real MLA decode (the compile path returns early, so it passes
    # boot+warmup then crashes on the first request). 0 restores the plain-string path.
    VLLM_USE_LAYERNAME: "0"
    VLLM_ROCM_USE_AITER: "1"
    VLLM_ROCM_USE_AITER_RMSNORM: "1"
    VLLM_ROCM_USE_AITER_MLA: "1"
    KV_BLOCK_SIZE: "1"
    KV_CACHE_DTYPE: "fp8"
    VLLM_CUDAGRAPH_MODE: "NONE"
    PREFILL_CUDAGRAPH_MODE: "NONE"
    # FULL graph for the uniform-decode shapes, PIECEWISE for everything else. Chosen
    # over plain PIECEWISE because it measured faster for decode on MI300X; the gain
    # narrows as EP widens, since the cross-node all2all inside the captured step does
    # not compress. Costs a longer boot (capture is slower and the captured graphs hold
    # more memory than PIECEWISE) - notable for CI. Set PIECEWISE to fall back.
    DECODE_CUDAGRAPH_MODE: "FULL_AND_PIECEWISE"
    CUDAGRAPH_CAPTURE_SIZES: "1 2 4 8 16 32 64 128 256"
    # Moves graph partitioning to inductor codegen (MLA KV-update becomes an eager
    # boundary). The connector default is OFF, so GLM opts in here and no other model's
    # --compilation-config changes. Not a correctness requirement - an A/B was accuracy-
    # neutral and within noise on latency - but kept ON because it is the configuration
    # this recipe was exercised with.
    USE_INDUCTOR_GRAPH_PARTITION: "1"
    VLLM_ALL2ALL_BACKEND: "mori_high_throughput"
    PREFILL_MORI_BACKEND: "mori_high_throughput"
    DECODE_MORI_BACKEND: "mori_low_latency"
    # MoRI EP shared-memory heap (16 GiB). The dispatch/combine width itself is set by
    # decode.dp below, not by this.
    MORI_SHMEM_HEAP_SIZE: "17179869184"
    # DSA sparse-indexer logits-buffer cap (crash fix). The indexer only sub-chunks the
    # query dim when M*N*4 exceeds this budget; the 512MB default lets an 8192-token
    # prefill launch fp8_mqa_logits at grid=(8192,), which HARD-FAULTS the worker on
    # gfx942 (silent GPU fault -> DP group collapse -> 503 at >=8k prompts). 64MB forces
    # M-dim sub-chunking (~2k tokens/chunk) so the buffer and launch stay bounded.
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "64"
    # NCCL heartbeat watchdog: at long context (>~8k) a DP rank's sparse-MLA/MoE all2all
    # can exceed the default HeartbeatMonitor timeout, so the monitor declares the rank
    # dead and tears down the whole process group -> prefill EngineCore crash -> 503.
    # Disable the monitor-triggered teardown and extend the timeouts.
    TORCH_NCCL_ENABLE_MONITORING: "0"
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: "1800"
    TORCH_NCCL_DUMP_ON_TIMEOUT: "0"
    TORCH_NCCL_BLOCKING_WAIT: "0"
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_IB_TIMEOUT: "22"
    # Per-shape warmup before each measured isl/osl cell, which the sweep's global 32/32
    # con=1 warmup does not cover. Kept because the latency figures above were measured
    # with it on, not because it was shown to help: an A/B at 1024/1024 con=8 was neutral.
    # The script default is OFF, so no other model's sweep changes.
    SHAPE_WARMUP: "1"
  dp_flags: "--tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice --chat-template-content-format string"
  prefill:
    dp: ""
  decode:
    # PERF: the MoRI EP dispatch width comes from max_num_batched_tokens, so the decode
    # role otherwise runs an 8192-token-wide all2all every step, which dominates decode
    # latency. It cannot be shrunk via env: mori derives recv capacity from the send
    # width, so the buffer must still cover vLLM's profiling dummy run. Keep >= typical
    # prompt length: smaller values cut per-token latency but inflate TTFT sharply;
    # 2048 was the balance point.
    dp: "--max-num-batched-tokens 2048"

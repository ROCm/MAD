# ============================ MoE (TP + wideEP) ============================

# DeepSeek-V3 family. The env: block encodes the validated MoRI-EP recipe knobs
# (from MAD-private #324 DeepSeekV3_recipe.env). They are exported BEFORE the
# connector's setup_env, so they define the wideEP recipe by default while still
# yielding to a submit-time `-e` override. WIDE_EP=1 (wideEP) reads these; the
# connector emits --block-size/--kv-cache-memory-bytes/--all2all-backend from them.
# The tp: blocks are the TP-mode (WIDE_EP=0) flags (dense-style serving).
#   - block=16 + AITER_MLA=0: block=1 + AITER-MLA fp8 decode kernel GPU-faults.
#   - KV_CACHE_MEMORY_BYTES: skip the boot profiling forward (AITER eager fp8 quant
#     aiter_tensor_t bug). PREFILL cudagraph NONE (capture deadlocks 16-way DP),
#     DECODE PIECEWISE (ITL win). Per-role mori backends: prefill HT, decode LL.
#   - MoRIIO disagg fixes (#39276 etc.) are committed in-source in the image's vLLM
#     (Dockerfile VLLM_REF), so there is no runtime patcher to gate.
_deepseek_recipe_env: &deepseek_recipe_env
  VLLM_USE_V1: "1"
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_PAGED_ATTN: "0"
  VLLM_ROCM_USE_AITER_RMSNORM: "1"
  VLLM_USE_AITER_TRITON_SILU_MUL: "0"
  VLLM_ROCM_USE_AITER_MLA: "0"
  KV_BLOCK_SIZE: "16"
  KV_CACHE_DTYPE: "fp8"
  KV_CACHE_MEMORY_BYTES: "20000000000"
  VLLM_CUDAGRAPH_MODE: "PIECEWISE"
  PREFILL_CUDAGRAPH_MODE: "NONE"
  DECODE_CUDAGRAPH_MODE: "PIECEWISE"
  CUDAGRAPH_CAPTURE_SIZES: "1 2 4 8 16 32 64 128 256"
  TORCHINDUCTOR_BENCHMARK_KERNEL: "0"
  VLLM_ALL2ALL_BACKEND: "mori_high_throughput"
  PREFILL_MORI_BACKEND: "mori_high_throughput"
  DECODE_MORI_BACKEND: "mori_low_latency"
  MORI_SHMEM_HEAP_SIZE: "17179869184"

# DeepSeek family: wideEP, plus TP on the moriio connector only (MORIIO_TP_MODELS in
# run_xPyD_models.slurm; rixl TP stays rejected). The dp: blocks are empty because the
# moriio(mori) connector emits the validated wideEP serve flags (block-size, kv-cache-*,
# all2all, cudagraph) from the env: recipe above.
#
# tp: the TP baseline (TP8 per instance, experts sharded by TP, no all2all). The moriio TP
# path takes its degree from IO_TP_SIZE/GENERIC_TP_SIZE (default 8) and emits the per-role
# cudagraph mode with +quant_fp8 itself, but it does NOT read the KV knobs of the env:
# recipe, so they are stated here with the same values the wideEP path uses:
#   - --block-size 16 (block 1 + the AITER-MLA fp8 decode kernel GPU-faults; MLA is off
#     via the env: recipe on both paths)
#   - --kv-cache-memory-bytes: the same per-GPU KV budget as wideEP, and it skips the boot
#     profiling forward (AITER eager fp8 quant bug). Under TP the MLA cache is replicated
#     on every rank, so one instance holds 1/8 of the KV tokens a DP8 pool does.
#   - --no-enable-prefix-caching, which the wideEP path hardcodes: without it TP would
#     differ from wideEP in more than the parallelism.
_deepseek_tp: &deepseek_tp "--kv-cache-dtype fp8 --block-size 16 --kv-cache-memory-bytes 20000000000 --no-enable-prefix-caching"

DeepSeek-V3:
  roles:                                # what every role needs (scripts/common/recipe/recipe.py)
    default: {quantization: {weights: fp8, activations: fp8}, kv_cache: fp8}
    prefill: {}
    decode: {}
  env: *deepseek_recipe_env
  prefill:
    dp: ""
    tp: *deepseek_tp
  decode:
    dp: ""
    tp: *deepseek_tp


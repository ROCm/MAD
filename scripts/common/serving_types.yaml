# The serving types a platform may be sold for, and how far MAD supports each: a spec example
# (scripts/common/topology/specs), the launcher that runs it (none: expressible, not runnable), the
# benchmark that measures it and the accuracy check that guards it (scripts/vllm_dissag unless
# noted; none: still to build). benchmark_accuracy.sh runs any task set (JSONL) against the endpoint. tests check every file exists and that `launcher` really accepts
# the example and nothing else does. Plan: HARDWARE_GENERALIZATION_PLAN section 8.
online_low_latency:
  spec: vllm_disagg_2p2d_wide_ep_tp2.json
  launcher: vllm_dissag
  benchmark: benchmark_xPyD.sh          # concurrency sweep: TTFT / TPOT
  accuracy: benchmark_accuracy.sh       # BENCHMARK_SCRIPT=accuracy (task sets: ACC_TASKS)
high_throughput:
  spec: v2/helios_wide_ep72.json
  launcher: vllm_dissag
  benchmark: benchmark_xPyD.sh
  accuracy: benchmark_accuracy.sh       # BENCHMARK_SCRIPT=accuracy (task sets: ACC_TASKS)
disaggregated:
  spec: sglang_disagg_1p2d_dp_ep.json
  launcher: sglang_disagg
  benchmark: benchmark_xPyD.sh
  accuracy: none
wide_ep_moe:
  spec: vllm_disagg_2p2d_wide_ep_tp2_router_node.json
  launcher: vllm_dissag
  benchmark: benchmark_xPyD.sh
  accuracy: benchmark_accuracy.sh       # BENCHMARK_SCRIPT=accuracy (task sets: ACC_TASKS)
colocated:
  spec: vllm_colocated_2n_tp8_pp2.json
  launcher: vllm_multinode
  benchmark: benchmark_xPyD.sh
  accuracy: benchmark_accuracy.sh       # BENCHMARK_SCRIPT=accuracy (task sets: ACC_TASKS)
long_context:
  spec: vllm_disagg_2p2d_wide_ep_tp2.json
  launcher: vllm_dissag
  benchmark: benchmark_long_context.sh
  accuracy: benchmark_niah.sh           # needle-in-a-haystack recall per context length
agentic:
  spec: vllm_disagg_2p2d_wide_ep_tp2.json
  launcher: vllm_dissag
  benchmark: benchmark_agentic.sh       # multi-turn trace replay, prefix retention
  accuracy: benchmark_accuracy.sh       # BENCHMARK_SCRIPT=accuracy (task sets: ACC_TASKS)
speculative:                            # a role's `speculative:` in the recipe (draft inside the server)
  spec: vllm_colocated_2n_tp8_pp2.json
  launcher: vllm_multinode
  benchmark: benchmark_xPyD.sh
  accuracy: benchmark_accuracy.sh       # BENCHMARK_SCRIPT=accuracy (task sets: ACC_TASKS)
speculative_draft_pool:                 # the draft model on GPUs of its own (a draft role)
  spec: v2/speculative_draft.json
  launcher: none
  benchmark: none
  accuracy: none
multi_tenant:                           # REPLICAS=1: GPUS_PER_NODE / TP independent servers behind a router
  spec: v2/mi355x_cpx_multitenant.json
  launcher: vllm_multinode
  benchmark: benchmark_xPyD.sh
  accuracy: benchmark_accuracy.sh
multimodal:
  spec: v2/multimodal_encoder.json
  launcher: none
  benchmark: none
  accuracy: none
embeddings:                             # a pooling server (flags: e.g. --runner pooling), replicas of TP 1
  spec: v2/embedding_server.json
  launcher: vllm_multinode
  benchmark: benchmark_embeddings.sh    # BENCHMARK_SCRIPT=embeddings: inputs/s, p50/p99 per concurrency
  accuracy: none
heterogeneous_pools:
  spec: v2/hetero_prefill_decode.json
  launcher: none
  benchmark: benchmark_xPyD.sh
  accuracy: none
multi_lora:                             # a role's `lora:` (adapters beside the base model)
  spec: vllm_colocated_2n_tp8_pp2.json
  launcher: vllm_multinode
  benchmark: benchmark_lora.sh          # BENCHMARK_SCRIPT=lora: requests spread over the adapters
  accuracy: benchmark_accuracy.sh
rl_rollout:
  spec: none
  launcher: none
  benchmark: none
  accuracy: none

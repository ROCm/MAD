# ATOM vLLM Plugin - Performance tuning overrides
# Merge strategy: Base config wins; perf fills gaps (missing keys only)
# These settings are gap-filled into base configs when models match

# Kimi K2.5 MXFP4 variant
- model: amd/Kimi-K2.5-MXFP4-AttnFP8 amd/Kimi-K2.5-MXFP4 moonshotai/Kimi-K2.5
  extra_args:
    --kv-cache-dtype: fp8
    --trust-remote-code: True
    --async-scheduling: True
    --load-format: safetensors
    --compilation-config: "{\"cudagraph_mode\": \"FULL_AND_PIECEWISE\"}"
    --gpu-memory-utilization: 0.9
    --no-enable-prefix-caching: True
    --max-model-len: 16384
    --max-num-batched-tokens: 16384
  bench_args:
    --trust-remote-code: True
  env:
    HSA_NO_SCRATCH_RECLAIM: '1'
    AITER_QUICK_REDUCE_QUANTIZATION: INT4


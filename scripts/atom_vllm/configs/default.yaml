# ATOM vLLM Plugin - Default serving benchmarks
# Llama: 1k 1k mc1 mc8 mc32 mc128; other models: 8k 1k

## Llama 3.1 models with ATOM vLLM plugin
- benchmark: serving
  model: meta-llama/Llama-3.1-8B-Instruct amd/Llama-3.1-8B-Instruct-FP8-KV
  tp: 1
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32

## Split so each model matches its own perf.yaml entry (overrides are matched per base entry)
- benchmark: serving
  model: meta-llama/Llama-3.1-405B-Instruct
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128

- benchmark: serving
  model: meta-llama/Llama-3.1-405B-Instruct-FP8
  tp: 8
  inp: 1024
  out: 1024
  dtype: auto
  max_concurrency: 1 8 32 128

- benchmark: serving
  model: meta-llama/Llama-3.3-70B-Instruct

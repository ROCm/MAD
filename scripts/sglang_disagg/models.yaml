DeepSeek-V3:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  # --enable-dp-attention-local-control-broadcast on both roles: forces all DP ranks to
  # step together so idle ranks enter the MoRI EP collective. prefill/decode dp use the
  # same mode-level flags, so they live in dp_flags (role-specific batch tuning is in prefill.dp/decode.dp).
  dp_flags: "--moe-a2a-backend mori --enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 --enable-dp-attention-local-control-broadcast"
  prefill:
    tp: "--disable-cuda-graph"
    dp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 3) --mem-fraction-static 0.65"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"
    dp: "--max-running-requests 8192 --cuda-graph-bs 1 2 4 8 16 24 32 48 64 96 128"

DeepSeek-R1:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  dp_flags: "--moe-a2a-backend mori --enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 --enable-dp-attention-local-control-broadcast"
  prefill:
    tp: "--disable-cuda-graph"
    dp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 3)"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"
    dp: "--max-running-requests 8192 --cuda-graph-bs 1 2 4 8 16 24 32 48 64 96 128"

# Kimi K2 Instruct (0905): 1T MLA + MoE, native FP8 (block-fp8, non-thinking).
# FP8 uses the mature Fp8MoEMethod runner, which has the DeepEP-style pre-permute
# registered, so this runs the full MoRI expert all-to-all plus CUDA graphs -- the
# same proven path as DeepSeek-R1. The only Kimi-specific server flag is
# --tool-call-parser kimi_k2 (no reasoning parser: Instruct is reflex-grade).
# --dist-timeout 3600 absorbs NFS weight-load skew across nodes at this size.
# SGLANG_ROCM_FUSED_DECODE_MLA=0, forced by the launcher for any Kimi-K2 model,
# still applies -- it matches upstream's own default and its Kimi-K2 ROCm CI
# recipes. Note --attention-backend aiter above is what arms that flag at all:
# the fused path is only reached when the flag is on AND the backend is aiter
# (srt/models/deepseek_common/attention_backend_handler.py:_dispatch_mla_subtype).
# There is no head-count guard there, so the flag is the only thing deciding it.
Kimi-K2-Instruct:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73 --dist-timeout 3600 --tool-call-parser kimi_k2 --disable-shared-experts-fusion"
  dp_flags: "--moe-a2a-backend mori --enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 --enable-dp-attention-local-control-broadcast"
  prefill:
    tp: "--disable-cuda-graph"
    dp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 3)"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"
    dp: "--max-running-requests 8192 --cuda-graph-bs 1 2 4 8 16 24 32 48 64 96 128"

# GPT-OSS-120B is small enough (~117B total / ~5.1B active) that a single
# 8-GPU node holds the full model at TP=8; no cross-node EP/MoRI needed (same
# as pyt_vllm_disagg_nixl_gpt-oss-120b in models.json, which also runs RUN_MORI=0).
# Each prefill/decode node in xPyD is an independent TP=8 replica (tp mode only).
# --moe-runner-backend triton: the mxfp4 quant path's default ROCm+aiter MoE
# kernel (aiter's Composable Kernel `moe_cktile2stages_gemm1`) fails to load
# on gfx942 with `undefined symbol: ..._pk_float4_e2m1_t...` (the CK MXFP4
# GEMM instantiation for gfx942 isn't compiled into this aiter build), so
# force the generic Triton MoE runner instead — sglang's own fallback for
# "ROCm+aiter without mxfp4" already uses "triton" for the same GEMM-coverage
# reason (see server_args.py comment: "aiter CK kernel doesn't support all
# GEMM dimensions"); this makes GPT-OSS's mxfp4 MoE layer use that same,
# already-proven-on-ROCm path instead of the broken aiter CK one.
# --attention-backend triton for the same class of reason, on the attention side:
# with aiter, prefill dies at the first attention call on gfx950 —
# "no matching kernel found. page_size=1, num_pages=16530956, dtype=bf16 ... CDNA3+
# GPU (MI300/MI350) is required" from aiter's CK dispatch
# (csrc/py_itfs_ck/mha_batch_prefill_kernels.cu:826). A 288 GB MI355X gives an
# 18M-page KV pool at page_size=1, whose offsets leave int32, and the variant that
# handles that is only compiled for gfx942 in this aiter build. Decode is unaffected,
# but this stays a whole-model setting so prefill and decode keep an identical KV
# layout, which mooncake's chunk transfer needs. SGLANG_USE_AITER=0 does NOT cover
# this: an explicit --attention-backend wins over the env toggle.
GPT-OSS-120B:
  base_flags: "--attention-backend triton --moe-runner-backend triton --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"

# Llama 4 Scout: 17Bx16E MoE, bf16. --disable-custom-all-reduce: the custom
# all-reduce kernel SIGSEGVs on gfx950 during the embedding all-reduce in warmup;
# fall back to plain RCCL all-reduce. --attention-backend triton avoids the AITER
# attention path that segfaults on gfx950 warmup and is harmless on gfx942 (verified
# there: coherent completions). Context 131072.
#
# The two arches need opposite things here, so both live in arch_flags, not base_flags.
#
# gfx95 needs --moe-runner-backend triton: the AITER MoE kernels segfault during warmup.
# gfx942 must NOT have it. There it silently corrupts output while every harness signal
# stays green -- a 4-node 2P2D run produced a full 8/8 benchmark sweep at 2501 tok/s
# while every generated token was id 0, and a single-node run with only this flag
# returned multilingual gibberish ("iscentrouwd 의존해야傾 ocean...") where the same
# server without it answers "Paris. Paris is known as the City of Light".
# bench_serving counts tokens, not meaning, so nothing in the harness catches it.
#
# gfx942 then needs a higher --mem-fraction-static than the 0.8 that suits gfx95:
# falling back to the AITER MoE runner costs more device memory, and on a 192 GB card
# 0.8 leaves nothing for the KV cache ("Raise --mem-fraction-static above 0.854").
# Appended after base_flags, so this overrides the base value.
Llama-4-Scout-17B-16E-Instruct:
  base_flags: "--attention-backend triton --disable-custom-all-reduce --watchdog-timeout 1000000 --mem-fraction-static 0.8 --context-length 131072"
  arch_flags:
    gfx95: "--moe-runner-backend triton"
    gfx942: "--mem-fraction-static 0.9"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"

# Model catalog for sglang_disagg_mori_io_ep.sh (disaggregated PD).
# -----------------------------------------------------------------------------
# Loaded when MODEL_NAME is set; PARALLEL_MODE is tp or dp from DP_MODE in the shell:
#   DP_MODE=0 -> PARALLEL_MODE=tp -> tp_flags, prefill.tp, decode.tp (plus base_flags).
#   DP_MODE=1 -> PARALLEL_MODE=dp -> dp_flags, prefill.dp, decode.dp (plus base_flags).
# Do not set --tp-size or --disaggregation-transfer-backend here; the launcher manages those.
#
# Each model contains:
# - base_flags: always applied (prefill + decode)
# - tp_flags / dp_flags: mode-level flags applied to BOTH prefill and decode (omit if empty)
# - prefill/decode.<tp|dp>: role + mode specific flags
# - experimental_flags: optional extra CLI flags (omit if empty)

# --- Dense Llama / Qwen ---

Llama-3.1-8B-Instruct:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"

Qwen3-32B:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"

amd-Llama-3.3-70B-Instruct-FP8-KV:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.65"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"

Llama-3.1-405B-Instruct-FP8-KV:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.65"
  prefill:
    tp: "--disable-cuda-graph --disable-radix-cache"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 8)"

# --- MoE ---

Mixtral-8x7B-Instruct-v0.1:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"

DeepSeek-V3:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  # --enable-dp-attention-local-control-broadcast on both roles: forces all DP ranks to
  # step together so idle ranks enter the MoRI EP collective. prefill/decode dp use the
  # same mode-level flags, so they live in dp_flags (role-specific batch tuning is in prefill.dp/decode.dp).
  dp_flags: "--moe-a2a-backend mori --enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 --enable-dp-attention-local-control-broadcast"
  prefill:
    tp: "--disable-cuda-graph"
    dp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 3) --mem-fraction-static 0.65"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"
    dp: "--max-running-requests 8192 --cuda-graph-bs 1 2 4 8 16 24 32 48 64 96 128"

DeepSeek-R1:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  dp_flags: "--moe-a2a-backend mori --enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 --enable-dp-attention-local-control-broadcast"
  prefill:
    tp: "--disable-cuda-graph"
    dp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 3)"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"
    dp: "--max-running-requests 8192 --cuda-graph-bs 1 2 4 8 16 24 32 48 64 96 128"

DeepSeek-V4-Flash-FP8:
  # DeepSeek-V4-Flash (block-FP8 E4M3, [128,128]): 43L / 256 experts / topk6 / hidden 4096, 1M ctx.
  # DSV4 uses the dedicated 'dsv4' attention backend (NOT aiter). num_key_value_heads=1, so
  # attention CANNOT be tensor-sharded -> DP-attention is MANDATORY for any EP run (DP_MODE=1).
  # Requires the FP8-E4M3 checkpoint (NOT the INT8-packed sgl-project repackage).
  base_flags: "--attention-backend dsv4 --page-size 256 --kv-cache-dtype fp8_e4m3 --swa-full-tokens-ratio 0.1 --disable-shared-experts-fusion --tool-call-parser deepseekv4 --reasoning-parser deepseek-v4 --watchdog-timeout 1000000 --mem-fraction-static 0.90 --disable-custom-all-reduce"
  # MoRI-EP wide expert dispatch + DP-attention (mirrors DeepSeek-V3 EP path).
  dp_flags: "--moe-a2a-backend mori --enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 --enable-dp-attention-local-control-broadcast"
  prefill:
    tp: "--disable-cuda-graph"
    dp: "--max-running-requests 8192 --chunked-prefill-size 8192 --disable-cuda-graph --mem-fraction-static 0.80 --deepep-mode normal"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"
    dp: "--max-running-requests 8192 --chunked-prefill-size 8192 --disable-cuda-graph --mem-fraction-static 0.85 --deepep-mode low_latency"

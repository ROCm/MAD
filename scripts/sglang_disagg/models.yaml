# Model catalog for sglang_disagg_mori_io_ep.sh (disaggregated PD).
# -----------------------------------------------------------------------------
# Loaded when MODEL_NAME is set; PARALLEL_MODE is tp or dp from DP_MODE in the shell:
#   DP_MODE=0 -> PARALLEL_MODE=tp -> tp_flags, prefill.tp, decode.tp (plus base_flags).
#   DP_MODE=1 -> PARALLEL_MODE=dp -> dp_flags, prefill.dp, decode.dp (plus base_flags).
# Do not set --tp-size or --disaggregation-transfer-backend here; the launcher manages those.
#
# Each model contains:
# - base_flags: always applied (prefill + decode)
# - tp_flags / dp_flags: mode-level flags applied to BOTH prefill and decode (omit if empty)
# - prefill/decode.<tp|dp>: role + mode specific flags
# - experimental_flags: optional extra CLI flags appended after role/mode flags on BOTH prefill and decode workers.
#   Use for try-outs that are independent of TP vs DP (PARALLEL_MODE); omit or "" when unused.
#
# Radix prefix cache: base_flags below carry "--disable-radix-cache" for the default
# xPyD performance sweeps (clean, cache-free throughput). The agentic replay benchmark
# needs the cache ON, so the launcher (sglang_disagg_mori_io_ep.sh) STRIPS
# "--disable-radix-cache" from PREFILL/DECODE configs when BENCHMARK_SCRIPT=agentic
# (or ENABLE_RADIX_CACHE=1). That strip is exercised only by the agentic-tagged
# models.json entries (BENCHMARK_SCRIPT=agentic), not by any perf-sweep entry. Do not
# remove it here, or the perf sweeps lose their cache-free baseline.

# --- Dense Llama / Qwen ---

Llama-3.1-8B-Instruct:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"


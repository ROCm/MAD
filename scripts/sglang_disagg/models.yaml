# --- MoE ---

Mixtral-8x7B-Instruct-v0.1:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"

DeepSeek-V3:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  # --enable-dp-attention-local-control-broadcast on both roles: forces all DP ranks to
  # step together so idle ranks enter the MoRI EP collective. prefill/decode dp use the
  # same mode-level flags, so they live in dp_flags (role-specific batch tuning is in prefill.dp/decode.dp).
  dp_flags: "--moe-a2a-backend mori --enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 --enable-dp-attention-local-control-broadcast"
  prefill:
    tp: "--disable-cuda-graph"
    dp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 3) --mem-fraction-static 0.65"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"
    dp: "--max-running-requests 8192 --cuda-graph-bs 1 2 4 8 16 24 32 48 64 96 128"

DeepSeek-R1:
  base_flags: "--attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  dp_flags: "--moe-a2a-backend mori --enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 --enable-dp-attention-local-control-broadcast"
  prefill:
    tp: "--disable-cuda-graph"
    dp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 3)"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"
    dp: "--max-running-requests 8192 --cuda-graph-bs 1 2 4 8 16 24 32 48 64 96 128"

# GPT-OSS-120B is small enough (~117B total / ~5.1B active) that a single
# 8-GPU node holds the full model at TP=8; no cross-node EP/MoRI needed (same
# as pyt_vllm_disagg_nixl_gpt-oss-120b in models.json, which also runs RUN_MORI=0).
# Each prefill/decode node in xPyD is an independent TP=8 replica (tp mode only).
# --moe-runner-backend triton: the mxfp4 quant path's default ROCm+aiter MoE
# kernel (aiter's Composable Kernel `moe_cktile2stages_gemm1`) fails to load
# on gfx942 with `undefined symbol: ..._pk_float4_e2m1_t...` (the CK MXFP4
# GEMM instantiation for gfx942 isn't compiled into this aiter build), so
# force the generic Triton MoE runner instead — sglang's own fallback for
# "ROCm+aiter without mxfp4" already uses "triton" for the same GEMM-coverage
# reason (see server_args.py comment: "aiter CK kernel doesn't support all
# GEMM dimensions"); this makes GPT-OSS's mxfp4 MoE layer use that same,
# already-proven-on-ROCm path instead of the broken aiter CK one.
# --attention-backend triton for the same class of reason, on the attention side:
# with aiter, prefill dies at the first attention call on gfx950 —
# "no matching kernel found. page_size=1, num_pages=16530956, dtype=bf16 ... CDNA3+
# GPU (MI300/MI350) is required" from aiter's CK dispatch
# (csrc/py_itfs_ck/mha_batch_prefill_kernels.cu:826). A 288 GB MI355X gives an
# 18M-page KV pool at page_size=1, whose offsets leave int32, and the variant that
# handles that is only compiled for gfx942 in this aiter build. Decode is unaffected,
# but this stays a whole-model setting so prefill and decode keep an identical KV
# layout, which mooncake's chunk transfer needs. SGLANG_USE_AITER=0 does NOT cover
# this: an explicit --attention-backend wins over the env toggle.
GPT-OSS-120B:
  base_flags: "--attention-backend triton --moe-runner-backend triton --watchdog-timeout 1000000 --mem-fraction-static 0.73"
  prefill:
    tp: "--disable-cuda-graph"
  decode:
    tp: "--disable-radix-cache --cuda-graph-bs $(seq 1 512)"

variables:
  tokenizer_name: mosaicml/mpt-30b
  global_seed: 17
  max_seq_len: 8192 
  run_name:  # If left blank, will be read from env var $COMPOSER_RUN_NAME
  icl_max_seq_len: 2048

max_seq_len: ${variables.max_seq_len}
run_name: ${variables.run_name}
 
# Model
model:
  name: hf_causal_lm
  pretrained: true
  pretrained_model_name_or_path: mosaicml/mpt-30b
  init_device: mixed
  config_overrides:
    max_seq_len: ${variables.max_seq_len}
    attn_config:
      attn_impl: flash
      alibi: false
      # Note: we still use packing, but turn this off for memory.
      # Initial tests suggest this does not hurt performance too much.
      attn_uses_sequence_id: false
 
# Tokenizer
tokenizer:
  name: ${variables.tokenizer_name}
  kwargs:
    model_max_length: ${variables.max_seq_len}
 
# Dataloaders
train_loader:
  name: finetuning
  dataset:
    hf_name: mosaicml/instruct-v3
    split: train
    max_seq_len: ${variables.max_seq_len}
    allow_pad_trimming: false
    decoder_only_format: true
    packing_ratio: 9
    shuffle: true
  drop_last: true
  num_workers: 8
  pin_memory: false
  prefetch_factor: 2
  persistent_workers: true
  timeout: 0
 
eval_loader:
  name: finetuning
  dataset:
    hf_name: mosaicml/instruct-v3
    split: test
    max_seq_len: ${variables.max_seq_len}
    allow_pad_trimming: false
    decoder_only_format: true
    packing_ratio: 9
    shuffle: true
  drop_last: true
  num_workers: 8
  pin_memory: false
  prefetch_factor: 2
  persistent_workers: true
  timeout: 0
 
# Optimization
scheduler:
  name: linear_decay_with_warmup  # linear no warmup is HF default which dolly used
  t_warmup: 50ba
  alpha_f: 0
 
optimizer:
  # mimic InstructGPT
  name: decoupled_adamw
  lr: 9.65e-6
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-8
  weight_decay: 0
 
algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0
 
max_duration: 10ba
eval_interval: 0
eval_first: false
global_train_batch_size: 1024
 
# System
seed: ${variables.global_seed}
device_eval_batch_size: 1
device_train_microbatch_size: 8
precision: amp_fp16
 
# FSDP
fsdp_config:
  sharding_strategy: FULL_SHARD
  mixed_precision: PURE
  activation_checkpointing: true
  activation_checkpointing_reentrant: false
  activation_cpu_offload: false
  limit_all_gathers: true
  sync_module_states: true
 
# Logging
progress_bar: false
log_to_console: true
console_log_interval: 1ba
 
callbacks:
  speed_monitor:
    window_size: 1
  runtime_estimator: {}
  lr_monitor: {}
 

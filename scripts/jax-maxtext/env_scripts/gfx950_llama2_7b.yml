base_config: "base.yml"
run_name: "llama2_7b_training"
base_output_directory: "./"
hardware: "gpu"
steps: 50
model_name: "llama2-7b"
enable_goodput_recording: False
monitor_goodput: False
enable_checkpointing: False
attention: "cudnn_flash_te"
packing: True
log_period: 100
  #inter-node parallelism strategy
dcn_data_parallelism: -1
dcn_fsdp_parallelism: 1
  #intra-node parallelism strategy
ici_fsdp_parallelism: 8
ici_data_parallelism: 1
ici_tensor_sequence_parallelism: -1
remat_policy: "minimal_flash"
use_iota_embed: True
scan_layers: True
async_checkpointing: False
logits_dot_in_fp32: False
profiler: ""
dtype: "bfloat16"
quantization: ""
quantize_kvcache: False
kv_quant_axis: "heads_and_dkv"
kv_quant_dtype: "int8"
weight_dtype: bfloat16
checkpoint_is_quantized: False # Set to True if reading from a saved aqt quantized checkpoint
max_target_length: 4096
per_device_batch_size: 12
dataset_type: "synthetic"
tokenizer_path: "meta-llama/Llama-2-7b"

shardy: False

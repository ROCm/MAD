# model.yaml — MiniMax-M3 model def + ATOM disagg image/flags/router.
#
# MiniMax-M3 (MXFP4): served PD-disaggregated on AMD Instinct MI355X (gfx950).
#   All workers TP4 (no EP): the single-node M3 recipe found plain TP4 beats both TP8 and
#   TP4/EP4 on tok/s/GPU for this model on gfx950, so prefill and decode both use TP4 and we
#   tune the prefill:decode worker ratio (xP:yD) instead of TP. STP only (DECODE_MTP_SIZE=0).
#
# Source of truth: InferenceX `minimaxm3-fp4-mi355x-atom-disagg`
#   (SemiAnalysisAI/InferenceX configs/amd-master.yaml, PR #2000).

defaults:
  gpu_memory_util: 0.8       # ATOM --gpu-memory-utilization (InferenceX MEM_FRAC_STATIC 0.8)
  max_num_seqs: 256
  kv_cache_dtype: auto       # M3 MXFP4 uses the engine default KV dtype (unlike DSv4 fp8)
  block_size: 128            # InferenceX ATOM M3 BLOCK_SIZE=128
  max_model_len: 32768       # InferenceX ATOM M3 MAX_MODEL_LEN=32768
  max_num_batched_tokens: 32768
  tp: 4                      # per prefill/decode worker (TP4 throughout)

models:
  minimaxm3-fp4:
    dir: MiniMax-M3-MXFP4    # under cluster.models_root (staged to scratch); from amd/MiniMax-M3-MXFP4
    hf_repo: amd/MiniMax-M3-MXFP4
    arch: minimax_m3
    precision: fp4
    status: SCAFFOLDED       # ported from InferenceX; needs a live gfx950 dry-run

# ---- engines: disagg image + router + KV-transfer backend ----------------------------------
engines:
  atom-disagg:
    # InferenceX-VALIDATED M3 MXFP4 disagg path. atomesh router + mooncake RDMA KV.
    image: rocm/atom-dev:nightly_202607011530
    # bench client runs from a clean vLLM image (ATOM's own image can crash the bench client)
    bench_image: vllm/vllm-openai-rocm:nightly-9037498c22891e55b594f567fb91d9b4efbf3e99
    router: atomesh                # /usr/local/bin/atomesh launch --pd-disaggregation
    router_version: "04b120d3040e0dd1a6915e88a3a3c1f588e6684a"
    kv_connector: mooncake         # --kv-transfer-config '{"kv_connector":"mooncake",...}'
    entrypoint: "python3 -m atom.entrypoints.openai_server"
    env:
      SAFETENSORS_FAST_GPU: "1"
      AITER_QUICK_REDUCE_QUANTIZATION: "INT4"   # applied for non-DSv4 models in InferenceX server_atom.sh
    # engine-unique server flags (shared knobs come from defaults{})
    prefill_flags: "--trust-remote-code --no-enable_prefix_caching"
    decode_flags: "--trust-remote-code --no-enable_prefix_caching"
    router_flags: "--policy random --backend atom --disable-health-check --disable-circuit-breaker"
    status: PRIMARY                # validated M3 MXFP4 atom-disagg config

# ---- disagg topologies (from minimaxm3-fp4-mi355x-atom-disagg search-space) -----------------
# All workers TP4 -> 1 node/worker on 8-GPU nodes. xP + yD <= 3 (3-node mi355x-disagg pool).
topologies:
  1p1d:                  # 2 nodes: 1 prefill (TP4) + 1 decode (TP4), STP
    xP: 1
    yD: 1
    prefill: { tp: 4, ep: 1, dp_attn: false }
    decode:  { tp: 4, ep: 1, dp_attn: false, mtp_size: 0 }
    shapes:  ["8192,1024", "1024,1024"]
    conc:    [1, 2, 4, 8, 16, 32, 64, 128, 256]
  2p1d_dpa:              # 3 nodes: 2 prefill (TP4, DP-attn) + 1 decode (TP4, DP-attn), 8k1k tail
    xP: 2
    yD: 1
    prefill: { tp: 4, ep: 1, dp_attn: true }
    decode:  { tp: 4, ep: 1, dp_attn: true, mtp_size: 0 }
    shapes:  ["8192,1024"]
    conc:    [256, 512, 768, 1024]

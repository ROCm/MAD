# Extracted verbatim from SemiAnalysisAI/InferenceX configs/amd-master.yaml
# Config key: minimaxm3-fp4-mi355x-atom-disagg
minimaxm3-fp4-mi355x-atom-disagg:
  image: rocm/atom-dev:nightly_202607011530
  model: amd/MiniMax-M3-MXFP4
  model-prefix: minimaxm3
  runner: mi355x-disagg
  precision: fp4
  framework: atom-disagg
  router: { name: atomesh, version: "04b120d3040e0dd1a6915e88a3a3c1f588e6684a" }
  kv-p2p-transfer: mooncake
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # 1P1D TP4
      - conc-list: [ 1, 2, 4, 8, 16, 32, 64, 128, 256 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=0"
      # 2P1D, DPA TP4
      - conc-list: [ 256, 512, 768, 1024 ]
        prefill:
          num-worker: 2
          tp: 4
          ep: 1
          dp-attn: true
          additional-settings:
          - "PREFILL_NODES=2"
        decode:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: true
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=0"
      # 1P1D TP4
    - isl: 1024
      osl: 1024
      search-space:
      # 1P1D TP4
      - conc-list: [ 1, 2, 4, 8, 16, 32, 64, 128, 256 ]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "PREFILL_NODES=1"
        decode:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "DECODE_NODES=1"
          - "DECODE_MTP_SIZE=0"


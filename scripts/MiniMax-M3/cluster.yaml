# cluster.yaml — MiniMax-M3 disagg cluster definition. SCALE LEVER for multi-node PD.
# M3 MXFP4 disagg spans MULTIPLE nodes per serving instance: xP prefill nodes + yD decode
# nodes + 1 router (on prefill node 0). All workers TP4 => 1 node/worker on 8-GPU nodes,
# so 1p1d=2 nodes and 2p1d_dpa=3 nodes (the InferenceX mi355x-disagg pool is 3 nodes).

reservation: <your_slurm_reservation>
gpus_per_node: 8                 # gfx950 (MI355X)
hardware: MI355X

# Model staging root (same path on every node; local NVMe recommended).
# Stage amd/MiniMax-M3-MXFP4 to <models_root>/MiniMax-M3-MXFP4 (matches model.yaml dir).
models_root: /path/to/models

results_root: ./results

# Disagg ports (match InferenceX server_atom.sh defaults)
router_port: 8000
prefill_port: 8010
decode_port: 8020
handshake_port: 6301

# Node pool. The launcher picks the first
# (xP*pf_nodes_per_worker + yD*dec_nodes_per_worker) nodes for a given topology.
# 2p1d_dpa needs 3 nodes; list at least that many.
nodes:
  - <node-01>
  - <node-02>
  - <node-03>

resources:
  accelerators: mi250:1
  cpus: 32+
  memory: 256+
  image_id: rocm/pytorch-training:v25.5
setup:
  pip install accelerate transformers==4.51.3 datasets loguru tqdm
envs:
  HF_HOME: /mnt/hf_home
  ALLOW_ALL_RANKS_OUTPUT: 0
  NCCL_NET_GDR_LEVEL: LOC

volumes: # {mount_path}: {volume_name}
  /mnt/hf_home: hf-home

run: |
  ### env setup 
  conda deactivate
  source .venv/bin/activate

  env | grep -i NCCL

  ### torchtitan clone. SFT uses same dependency
  cd /workspace & git clone https://github.com/MotifTechnologies/MAD.git
  cd /workspace/MAD
  git checkout add_motif

  ### run!
  python /workspace/MAD/scripts/pyt_motif_training/SFT/train_motif.py
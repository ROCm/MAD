resources:
  accelerators: mi250:8
  cpus: 32+
  memory: 256+
  image_id: rocm/pytorch-training:v25.5
setup:
  pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/rocm6.3
  GPU_ARCHS=“gfx90a” pip install flash-attn==2.8.0.post2 --no-build-isolation
  pip install accelerate transformers==4.51.3 datasets loguru tqdm
envs:
  ALLOW_ALL_RANKS_OUTPUT: 0
  NCCL_NET_GDR_LEVEL: LOC
  HF_TOKEN: <huggingface-token> # modify this!!!!

run: |
  env | grep -i NCCL

  ### clone MAD repository
  git clone https://github.com/MotifTechnologies/MAD.git
  cd MAD/scripts/pyt_motif_training/SFT
  git checkout add_motif

  ### run!
  accelerate launch --config_file accelerate_config_1node.yaml train_motif.py
# ATOM accuracy overrides — merged into client-perf-hub's accuracy config at runtime.
#
# Structure:
# 1. Task-level defaults (entries with hf_pipeline_tag, no model field)
# 2. Model-level overrides (entries with model field)
#
# Merge behavior: Model-level evaluation parameters are deep-merged into
# task-level evaluations, so you only need to specify what differs.

# ── Task-level defaults (by hf_pipeline_tag) ──
- hf_pipeline_tag: text-generation
  evaluations:
    - framework: lm_eval
      task: gsm8k
      apply_chat_template: false
      num_fewshot: 5
      base_url: http://localhost:8000/v1/completions
      lm_eval_model: local-completions
      num_concurrent: 64
      max_gen_toks: 2048

# TODO: Add defaults for other pipeline tags when needed:
# - hf_pipeline_tag: text-to-image
#   evaluations:
#     - framework: compute_clip_score
# - hf_pipeline_tag: text-to-video
#   evaluations:
#     - framework: vbench

# ── Model-level overrides ──
# Only specify what differs from task defaults

# Models needing --trust-remote-code
- model: >
    amd/Kimi-K2.5-MXFP4
    amd/Kimi-K2.6-MXFP4
  extra_args:
    --trust-remote-code: true
  evaluations:
    - trust_remote_code: true

# Instruct/chat models needing apply_chat_template + chat-completions endpoint
- model: amd/DeepSeek-R1-0528-MXFP4-MTP-MoEFP4
  evaluations:
    - apply_chat_template: true
      lm_eval_model: local-chat-completions
      base_url: http://localhost:8000/v1/chat/completions

# Base models: override num_fewshot to 3 (inherits framework and other params from task defaults)
- model: openai/gpt-oss-120b
  evaluations:
    - num_fewshot: 3

# Kimi-K3 MXFP4: GSM8K 5-shot without chat template
# Expected range: flexible-extract 0.9538–0.9591
- model: moonshotai/Kimi-K3
  extra_args:
    --trust-remote-code: true
    --max-model-len: 16384
    --max-num-seqs: 64
    --max-num-batched-tokens: 16384
    --gpu-memory-utilization: 0.93
    --block-size: 128
    --no-enable_prefix_caching: true
  evaluations:
    - num_fewshot: 5
      apply_chat_template: false
      trust_remote_code: true
